<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>影径</title>
<meta name="description" content="一个关于光与影的等距小游戏：旅人只能走在影子里，转动光球，让小塔的影子替她铺出一条通往那扇门的路。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=ZCOOL+XiaoWei&display=swap">
<style>
  :root {
    /* Layout: full-bleed dusk sky with the floating court as the only subject; HUD pinned to the corners, end card as a centred veil */
    --sky-1: #ffe2cb;
    --sky-2: #f6bdb3;
    --sky-3: #bcaadb;
    --mist-0: rgba(188, 170, 219, 0);
    --sun: #fff4e2;
    --sun-halo: rgba(255, 236, 214, 0.55);
    --cloud: rgba(255, 247, 243, 0.62);
    --ink: #463d70;
    --ink-soft: #776c9c;
    --warm: #c2553f;
    --glass: rgba(255, 249, 245, 0.55);
    --glass-strong: rgba(255, 249, 245, 0.85);
    --line: rgba(70, 61, 112, 0.18);
    --veil: rgba(255, 241, 234, 0.82);
    --font-display: "ZCOOL XiaoWei", "Songti SC", "STSong", "Noto Serif SC", serif;
    --font-latin: "Marcellus", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    color-scheme: light;
  }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--sky-2);
    background-image: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 52%, var(--sky-3) 100%);
    color: var(--ink);
    font-family: var(--font-display);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .sun {
    position: absolute; width: 46vmin; height: 46vmin; left: 58%; top: 7%;
    border-radius: 50%;
    background: radial-gradient(circle, var(--sun) 0 28%, var(--sun-halo) 29%, transparent 68%);
  }
  .cloud {
    position: absolute; height: 8vmin; border-radius: 999px;
    background: var(--cloud); filter: blur(7px);
    animation: drift 150s linear infinite alternate;
  }
  .c1 { width: 40vmin; top: 24%; left: -10%; }
  .c2 { width: 28vmin; top: 47%; left: 72%; animation-duration: 190s; animation-direction: alternate-reverse; }
  .c3 { width: 58vmin; top: 66%; left: 6%; opacity: 0.75; animation-duration: 220s; }
  @keyframes drift { to { transform: translateX(16vw); } }

  #stage { position: fixed; inset: 0; z-index: 1; }
  #stage canvas { display: block; touch-action: none; outline: none; }

  .mist {
    position: fixed; left: 0; right: 0; bottom: 0; height: 26vh; z-index: 2; pointer-events: none;
    background: linear-gradient(to bottom, var(--mist-0) 0%, var(--sky-3) 86%);
  }

  .hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .title h1 {
    margin: 0;
    font: 400 clamp(24px, 3.2vw, 32px)/1.1 var(--font-display);
    letter-spacing: 0.3em;
    color: var(--ink);
  }
  .title p {
    margin: 8px 0 0;
    font: 400 11px/1.4 var(--font-latin);
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .actions { display: flex; gap: 10px; }
  .icon-btn {
    width: 42px; height: 42px; padding: 0;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--glass);
    color: var(--ink);
    cursor: pointer;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: background-color 0.2s, transform 0.2s;
  }
  .icon-btn:hover { background: var(--glass-strong); transform: translateY(-1px); }
  .icon-btn:focus-visible, .text-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn .off { display: none; }
  .icon-btn[aria-pressed="false"] .on { display: none; }
  .icon-btn[aria-pressed="false"] .off { display: block; }

  .hint {
    position: fixed; left: 0; right: 0; z-index: 3; margin: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
    font: 400 16px/1.5 var(--font-display);
    letter-spacing: 0.22em;
    color: var(--ink);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.45s ease, transform 0.45s ease;
    pointer-events: none;
  }
  .hint.show { opacity: 0.92; transform: none; }
  .hint.warm { color: var(--warm); }

  .card {
    position: fixed; inset: 0; z-index: 4;
    display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: radial-gradient(ellipse at 50% 45%, var(--veil) 0%, var(--veil) 28%, transparent 72%);
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  .card.show { opacity: 1; }
  .card-inner { display: grid; justify-items: center; gap: 14px; text-align: center; max-width: 30ch; }
  .card .eyebrow {
    margin: 0;
    font: 400 11px/1.4 var(--font-latin);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .card h2 {
    margin: 0;
    font: 400 clamp(40px, 8vw, 60px)/1 var(--font-display);
    letter-spacing: 0.3em;
    padding-left: 0.3em;
    color: var(--ink);
  }
  .card .line { margin: 0; font-size: 16px; line-height: 1.8; letter-spacing: 0.12em; color: var(--ink); }
  .text-btn {
    margin-top: 10px;
    font: 400 15px/1 var(--font-display);
    letter-spacing: 0.3em;
    padding: 13px 22px 13px 26px;
    border-radius: 999px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s;
  }
  .text-btn:hover { background: var(--ink); color: var(--sky-1); }

  @media (max-width: 480px) {
    .title h1 { letter-spacing: 0.22em; }
    .hint { font-size: 15px; letter-spacing: 0.14em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud { animation: none; }
    .hint, .card { transition: none; }
  }
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
</div>

<div id="stage"></div>
<div class="mist" aria-hidden="true"></div>

<header class="hud">
  <div class="title">
    <h1>影径</h1>
    <p>The Shadow Path · I</p>
  </div>
  <div class="actions">
    <button id="btn-sound" class="icon-btn" type="button" aria-pressed="true" aria-label="声音">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
    <button id="btn-reset" class="icon-btn" type="button" aria-label="重新开始">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg>
    </button>
  </div>
</header>

<p id="hint" class="hint" aria-live="polite"></p>

<section id="card" class="card" hidden aria-live="polite">
  <div class="card-inner">
    <p class="eyebrow">Chapter I · Complete</p>
    <h2>门开了</h2>
    <p class="line">她踩着影子穿过庭院，<br>走进了那扇门。</p>
    <button id="btn-again" class="text-btn" type="button">再走一次</button>
  </div>
</section>

<script>
  // if the module below never boots (offline, blocked CDN), say so instead of showing an empty sky
  setTimeout(function () {
    if (window.__spireBooted) return;
    var h = document.getElementById('hint');
    h.textContent = '3D 引擎没能加载，请检查网络后刷新页面';
    h.classList.add('show');
  }, 9000);
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }

<script type="module">
import * as THREE from 'three';

const hintEl = document.getElementById('hint');
function fail(msg) {
  hintEl.textContent = msg;
  hintEl.classList.add('show');
}
window.__spireBooted = true;

// ---------- level ----------
const TAU = Math.PI * 2;
const STEP = Math.PI / 4;             // the orb rests every 45 degrees
const SWEEP = Math.PI / 180;          // safety check resolution while it moves
const N = 7;
const POST = { x: 3, z: 3 };
const ARM_R = 1.45;
const LAMP_Y = 2.1;
const START = '6,6';
const START_K = 5;
const GATE = '1,-1';
const GATE_IN = '1,0';
const STEP_TIME = 0.42;

// Every occluder is an axis-aligned box. The same boxes cast the rendered
// shadow and decide which tiles she may stand on, so what you see is the rule.
const PILLARS = [
  { x: 3, z: 0, h: 2.7 },
  { x: 1, z: 5, h: 2.7 },
  { x: 3, z: 4, h: 1.2 },
];
const WALLS = [                       // low walls running along z
  { x: 2, z0: 1, len: 3, h: 1.0 },
  { x: 4, z0: 2, len: 3, h: 1.0 },
];
const OCCLUDERS = [];
PILLARS.forEach((p) => OCCLUDERS.push({ lo: [p.x - 0.35, 0, p.z - 0.35], hi: [p.x + 0.35, p.h, p.z + 0.35] }));
WALLS.forEach((w) => OCCLUDERS.push({ lo: [w.x - 0.18, 0, w.z0 - 0.5], hi: [w.x + 0.18, w.h, w.z0 + w.len - 0.5] }));

const key = (x, z) => x + ',' + z;
const BLOCKED = new Set([key(POST.x, POST.z)]);
PILLARS.forEach((p) => BLOCKED.add(key(p.x, p.z)));
WALLS.forEach((w) => { for (let i = 0; i < w.len; i++) BLOCKED.add(key(w.x, w.z0 + i)); });
const TILES = new Map();
for (let x = 0; x < N; x++) {
  for (let z = 0; z < N; z++) {
    if (!BLOCKED.has(key(x, z))) TILES.set(key(x, z), { id: key(x, z), x, z });
  }
}
TILES.set(GATE, { id: GATE, x: 1, z: -1, gate: true });

function lampAt(theta, out) {
  out[0] = POST.x + ARM_R * Math.cos(theta);
  out[1] = LAMP_Y;
  out[2] = POST.z + ARM_R * Math.sin(theta);
  return out;
}
function segHitsBox(p, q, lo, hi) {
  let t0 = 0, t1 = 1;
  for (let a = 0; a < 3; a++) {
    const d = q[a] - p[a];
    if (Math.abs(d) < 1e-9) {
      if (p[a] < lo[a] || p[a] > hi[a]) return false;
      continue;
    }
    let ta = (lo[a] - p[a]) / d, tb = (hi[a] - p[a]) / d;
    if (ta > tb) { const s = ta; ta = tb; tb = s; }
    if (ta > t0) t0 = ta;
    if (tb < t1) t1 = tb;
    if (t0 > t1) return false;
  }
  return true;
}
// a tile is shadow when at least 3 of its 5 sample points cannot see the orb
const SAMPLES = [[0, 0], [0.25, 0.25], [-0.25, 0.25], [0.25, -0.25], [-0.25, -0.25]];
const _p = [0, 0.05, 0], _q = [0, 0, 0];
function inShadow(tile, theta) {
  if (tile.gate) return true;
  lampAt(theta, _q);
  let dark = 0;
  for (const s of SAMPLES) {
    _p[0] = tile.x + s[0];
    _p[2] = tile.z + s[1];
    for (const o of OCCLUDERS) {
      if (segHitsBox(_p, _q, o.lo, o.hi)) { dark++; break; }
    }
  }
  return dark >= 3;
}
function shadeAt(theta) {
  const out = new Set();
  TILES.forEach((t) => { if (inShadow(t, theta)) out.add(t.id); });
  return out;
}
function neighbours(id) {
  const t = TILES.get(id), out = [];
  [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dz]) => {
    const n = TILES.get(key(t.x + dx, t.z + dz));
    if (n) out.push(n.id);
  });
  return out;
}
function findPath(from, to, shade) {
  if (from === to) return [from];
  const prev = new Map([[from, null]]);
  const queue = [from];
  while (queue.length) {
    const cur = queue.shift();
    for (const n of neighbours(cur)) {
      if (!shade.has(n) || prev.has(n)) continue;
      prev.set(n, cur);
      if (n === to) {
        const path = [to];
        for (let p = cur; p; p = prev.get(p)) path.unshift(p);
        return path;
      }
      queue.push(n);
    }
  }
  return null;
}

// ---------- renderer ----------
const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (err) {
  fail('这个浏览器没有开启 WebGL，无法显示庭院');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;
const canvas = renderer.domElement;
canvas.setAttribute('role', 'img');
canvas.setAttribute('aria-label', '黄昏里漂浮的庭院。旅人只能走在影子里，拖动或点击光球改变影子，点击影子里的石板让她走过去。键盘按 R 转动光球。');
stage.appendChild(canvas);

const ISO = new THREE.Vector3(1, 1, 1).normalize();
const SCREEN_R = new THREE.Vector3(1, 0, -1).normalize();
const SCREEN_U = new THREE.Vector3(-1, 2, -1).normalize();
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-5, 5, 5, -5, 0.1, 500);
camera.position.copy(ISO).multiplyScalar(150);
camera.lookAt(0, 0, 0);

// Flat, face-by-face shading like the first demo: lavender sky light everywhere,
// a soft key light that separates top, left and right faces, and the warm orb on top.
// (r160 uses physical light units, so these read about pi times the old values.)
scene.add(new THREE.HemisphereLight(0xe6dbff, 0xd6c6e6, 1.1));
const keyLight = new THREE.DirectionalLight(0xffffff, 0.75);
keyLight.position.set(0.15, 0.85, 0.5);
scene.add(keyLight);
const warmLight = new THREE.DirectionalLight(0xffb4a2, 0.35);
warmLight.position.set(1, 0.1, -0.2);
scene.add(warmLight);

// ---------- materials ----------
const lam = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c, flatShading: true }, o || {}));
const MAT = {
  floor: [lam(0xf6ecf2), lam(0xefe3ec)],
  plinth: lam(0xead8e4),
  plinthDeep: lam(0xdcc6da),
  stone: lam(0xf4e9f2),
  stoneWarm: lam(0xf0dee4),
  coral: lam(0xe9907c),
  indigo: lam(0x5a5596),
  mint: lam(0x9fd3c7),
  gold: lam(0xf2c76b, { emissive: 0x4a3200 }),
  robe: lam(0xffffff, { emissive: 0x6b6070, flatShading: false }),
  scarf: lam(0xf0857a, { emissive: 0x3a1410, flatShading: false }),
};
const flat = (c) => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
const DECAL = { window: flat(0x8a7fb3), frame: flat(0xd9c9e3) };

// ---------- builders ----------
const BOX = new THREE.BoxGeometry(1, 1, 1);
const pickables = [];
function mesh(geo, mat, parent, opt) {
  opt = opt || {};
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = opt.cast !== false;
  m.receiveShadow = opt.receive !== false;
  (parent || scene).add(m);
  if (opt.pick !== false) pickables.push(m);
  return m;
}
function box(x, y, z, sx, sy, sz, mat, parent, opt) {
  const m = mesh(BOX, mat, parent, opt);
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  return m;
}
const flatNormals = (g) => { const n = g.toNonIndexed(); n.computeVertexNormals(); return n; };
const PYR_UP = (() => { const g = new THREE.ConeGeometry(Math.SQRT1_2, 1, 4); g.rotateY(Math.PI / 4); return flatNormals(g); })();
const PYR_DOWN = (() => { const g = new THREE.ConeGeometry(Math.SQRT1_2, 1, 4); g.rotateY(Math.PI / 4); g.rotateX(Math.PI); return flatNormals(g); })();
function pyramid(geo, x, yBase, z, w, h, d, mat, opt) {
  const m = mesh(geo, mat, scene, opt);
  m.scale.set(w, h, d);
  m.position.set(x, geo === PYR_DOWN ? yBase - h / 2 : yBase + h / 2, z);
  return m;
}
function dome(x, y, z, r, mat) {
  return mesh(new THREE.SphereGeometry(r, 28, 14, 0, TAU, 0, Math.PI / 2), mat).position.set(x, y, z);
}
function finial(x, y, z, s) {
  s = s || 1;
  mesh(new THREE.CylinderGeometry(0.02 * s, 0.02 * s, 0.26 * s, 8), MAT.gold).position.set(x, y + 0.13 * s, z);
  mesh(new THREE.SphereGeometry(0.055 * s, 14, 10), MAT.gold).position.set(x, y + 0.28 * s, z);
}
function archGeo(w, h) {
  const r = w / 2, s = new THREE.Shape();
  s.moveTo(-r, 0);
  s.lineTo(-r, h - r);
  s.absarc(0, h - r, r, Math.PI, 0, true);
  s.lineTo(r, 0);
  s.closePath();
  return new THREE.ShapeGeometry(s, 12);
}
const ARCH_WINDOW = archGeo(0.24, 0.42);
// a flat arch on the visible +z or +x face of a block centred at (x, z) with the given half width
function decal(x, y, z, face, half, geo, mat) {
  const m = new THREE.Mesh(geo || ARCH_WINDOW, mat || DECAL.window);
  if (face === 'x') { m.position.set(x + half + 0.003, y, z); m.rotation.y = Math.PI / 2; }
  else m.position.set(x, y, z + half + 0.003);
  scene.add(m);
  return m;
}

// ---------- the floating court ----------
for (let x = 0; x < N; x++) {
  for (let z = 0; z < N; z++) {
    const slab = box(x, -0.12, z, 0.97, 0.24, 0.97, MAT.floor[(x + z) % 2]);
    if (TILES.has(key(x, z))) slab.userData.tile = key(x, z);
  }
}
box(2.5, -0.55, 2.5, 8, 0.62, 8, MAT.plinth, scene, { cast: false });
box(2.5, -1.06, 2.5, 7, 0.4, 7, MAT.plinthDeep, scene, { cast: false, pick: false });
pyramid(PYR_DOWN, 2.5, -1.26, 2.5, 6, 3.4, 6, MAT.plinthDeep, { cast: false, pick: false });

// back and left walls, a cornice, and three little towers in the old style
const WALL_H = 2.3;
box(2.5, WALL_H / 2, -1, 8, WALL_H, 1, MAT.stone);
box(-1, WALL_H / 2, 3, 1, WALL_H, 7, MAT.stone);
box(2.5, WALL_H + 0.05, -1, 8.12, 0.1, 1.12, MAT.stoneWarm);
// the left cornice starts where the back one ends, so the corner has no overlapping faces
box(-1, WALL_H + 0.05, 3.03, 1.12, 0.1, 6.94, MAT.stoneWarm);
[4.5, 5.4].forEach((x) => decal(x, 1.0, -1, 'z', 0.5));
[1.3, 2.7, 4.1].forEach((z) => decal(-1, 1.0, z, 'x', 0.5));

box(-1, 1.6, -1, 1, 3.2, 1, MAT.stone);
box(-1, 3.24, -1, 1.12, 0.1, 1.12, MAT.stoneWarm);
dome(-1, 3.29, -1, 0.42, MAT.indigo);
finial(-1, 3.68, -1, 1.2);
decal(-1, 2.5, -1, 'z', 0.5);
decal(-1, 2.5, -1, 'x', 0.5);

box(6, 1.45, -1, 1, 2.9, 1, MAT.stone);
pyramid(PYR_UP, 6, 2.9, -1, 1.04, 0.72, 1.04, MAT.indigo);
finial(6, 3.6, -1);
decal(6, 1.5, -1, 'x', 0.5);

box(-1, 1.45, 6, 1, 2.9, 1, MAT.stone);
mesh(new THREE.ConeGeometry(0.56, 0.8, 32), MAT.coral).position.set(-1, 3.3, 6);
finial(-1, 3.68, 6);

// ---------- sound ----------
const Sound = {
  ctx: null,
  on: true,
  si: 0,
  ensure() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const c = this.ctx;
    this.master = c.createGain();
    this.master.gain.value = this.on ? 0.85 : 0;
    this.master.connect(c.destination);
    this.dry = c.createGain();
    this.dry.gain.value = 0.75;
    this.dry.connect(this.master);
    const verb = c.createConvolver();
    verb.buffer = this.impulse(3.2);
    this.wet = c.createGain();
    this.wet.gain.value = 0.5;
    this.wet.connect(verb);
    verb.connect(this.master);
    this.pad();
  },
  impulse(sec) {
    const c = this.ctx, n = Math.floor(c.sampleRate * sec), buf = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.6);
    }
    return buf;
  },
  send(node) { node.connect(this.dry); node.connect(this.wet); },
  bell(freq, delay, vol, decay) {
    const c = this.ctx;
    if (!c) return;
    const t = c.currentTime + (delay || 0);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    [[1, 1], [2, 0.22], [3.01, 0.07]].forEach(([m, a]) => {
      const o = c.createOscillator(), og = c.createGain();
      o.frequency.value = freq * m;
      og.gain.value = a;
      o.connect(og);
      og.connect(g);
      o.start(t);
      o.stop(t + decay + 0.1);
    });
    this.send(g);
  },
  step() {
    const seq = [587.33, 659.25, 739.99, 880, 987.77, 880, 739.99, 659.25];
    this.si = (this.si + 1) % seq.length;
    this.bell(seq[this.si], 0, 0.045, 0.55);
  },
  tick() {
    const c = this.ctx;
    if (!c) return;
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(1500, t);
    o.frequency.exponentialRampToValueAtTime(700, t + 0.04);
    g.gain.setValueAtTime(0.03, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g);
    this.send(g);
    o.start(t);
    o.stop(t + 0.06);
  },
  thud() {
    const c = this.ctx;
    if (!c) return;
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(62, t + 0.3);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.2, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g);
    this.send(g);
    o.start(t);
    o.stop(t + 0.55);
  },
  rest() { this.bell(880, 0, 0.06, 2.2); this.bell(1318.5, 0.12, 0.045, 2.4); },
  blocked() { this.thud(); this.bell(207.65, 0.02, 0.05, 0.6); },
  nope() { this.bell(220, 0, 0.04, 0.35); },
  win() { [293.66, 369.99, 440, 587.33, 739.99, 880, 1174.66].forEach((f, i) => this.bell(f, i * 0.14, 0.09, 2.8)); },
  pad() {
    const c = this.ctx, t = c.currentTime;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 5);
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 650;
    lp.Q.value = 0.4;
    const lfo = c.createOscillator(), depth = c.createGain();
    lfo.frequency.value = 0.06;
    depth.gain.value = 260;
    lfo.connect(depth);
    depth.connect(lp.frequency);
    lfo.start(t);
    [146.83, 220, 329.63, 369.99].forEach((f, i) => {
      [-4, 4].forEach((cents) => {
        const o = c.createOscillator(), og = c.createGain();
        o.type = 'triangle';
        o.frequency.value = f;
        o.detune.value = cents + i;
        og.gain.value = 0.18;
        o.connect(og);
        og.connect(lp);
        o.start(t);
      });
    });
    lp.connect(g);
    this.send(g);
  },
  toggle(on) {
    this.on = on;
    if (this.master) this.master.gain.setTargetAtTime(on ? 0.85 : 0, this.ctx.currentTime, 0.08);
  },
};

// ---------- state ----------
const state = { theta: START_K * STEP, k: START_K, won: false, moved: false, rotated: false, winT: -1, shake: 0, shiver: 0 };
let shade = new Set();
const walker = { tile: START, step: null, path: [], pending: null, exit: null };
let lampAnim = null;
const mod8 = (k) => ((k % 8) + 8) % 8;

function tileWorld(id, out) {
  const t = TILES.get(id);
  return out.set(t.x, 0, t.z);
}
function setLampTheta(theta) {
  state.theta = theta;
  arm.rotation.y = -theta;
  renderer.shadowMap.needsUpdate = true;
}
// how far the orb can travel toward `to` before its light would reach her
function safeReach(from, to) {
  const tile = TILES.get(walker.tile);
  const dir = Math.sign(to - from);
  let a = from;
  while (Math.abs(to - a) > 1e-9) {
    const next = Math.abs(to - a) <= SWEEP ? to : a + dir * SWEEP;
    if (!inShadow(tile, next)) return { angle: a, blocked: true };
    a = next;
  }
  return { angle: a, blocked: false };
}
function settleLamp(theta) {
  const before = state.k;
  state.k = mod8(Math.round(theta / STEP));
  setLampTheta(theta);
  shade = shadeAt(theta);
  if (state.k !== before) {
    state.rotated = true;
    Sound.rest();
  }
  updateHint();
}
function animateLamp(to, dur) {
  lampAnim = { from: state.theta, to, t: 0, dur: dur || 0.32 + 0.3 * Math.min(2, Math.abs(to - state.theta) / STEP) };
}
function rotateBy(n) {
  if (state.won || walker.step || lampAnim) return;
  const target = (Math.round(state.theta / STEP) + n) * STEP;
  const r = safeReach(state.theta, target);
  if (r.blocked) { onBlocked(); return; }
  animateLamp(target);
}
function onBlocked() {
  state.shake = 1;
  state.shiver = 1;
  Sound.blocked();
  flashHint('再转下去，光就会照到她', true);
}

// ---------- hints ----------
let hintTimer = 0, flashTimer = 0, flashing = false;
function showHint(text, warm) {
  if (hintEl.dataset.text === text && hintEl.classList.contains('warm') === !!warm) return;
  hintEl.dataset.text = text;
  hintEl.classList.remove('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => {
    hintEl.textContent = text;
    hintEl.classList.toggle('warm', !!warm);
    if (text) hintEl.classList.add('show');
  }, 220);
}
function flashHint(text, warm) {
  flashing = true;
  showHint(text, warm);
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { flashing = false; updateHint(); }, 2400);
}
function updateHint() {
  if (flashing) return;
  if (state.won) return showHint('');
  if (!state.rotated && !state.moved) return showHint('她只能走在影子里。拖动光球，影子会跟着转');
  if (findPath(walker.tile, GATE_IN, shade)) return showHint('门就在前面');
  if (state.rotated && !state.moved) return showHint('点影子里的石板，带她过去');
  return showHint('一边转动光球，一边走向那扇门');
}

// ---------- walking ----------
function walkTo(id) {
  if (state.won || lampAnim || (press && press.dragging)) return;
  if (!shade.has(id)) {
    flashTile(id);
    Sound.nope();
    flashHint('那里有光，她过不去', true);
    return;
  }
  if (walker.step) { walker.pending = id; return; }
  if (id === walker.tile) return;
  const path = findPath(walker.tile, id, shade);
  if (!path) {
    Sound.nope();
    flashHint('影子没有连到那里，转一转光球', true);
    return;
  }
  walker.path = path.slice(1);
  nextStep();
}
function nextStep() {
  if (walker.pending) {
    const p = findPath(walker.tile, walker.pending, shade);
    walker.pending = null;
    walker.path = p ? p.slice(1) : [];
  }
  if (!walker.path.length) { updateHint(); return; }
  const to = walker.path.shift();
  const a = tileWorld(walker.tile, new THREE.Vector3()), b = tileWorld(to, new THREE.Vector3());
  facing = Math.atan2(b.x - a.x, b.z - a.z);
  walker.step = { to, a, b, t: 0 };
  state.moved = true;
}
function updateWalker(dt) {
  const s = walker.step;
  char.rotation.y = turnToward(char.rotation.y, facing, dt * 12);
  if (s) {
    s.t = Math.min(1, s.t + dt / STEP_TIME);
    char.position.lerpVectors(s.a, s.b, s.t);
    body.position.y = Math.sin(s.t * Math.PI) * 0.03;
    if (s.t >= 1) {
      walker.tile = s.to;
      walker.step = null;
      Sound.step();
      if (s.to === GATE) { win(); return; }
      nextStep();
    }
    return;
  }
  if (walker.exit) {
    const e = walker.exit;
    e.t = Math.min(1, e.t + dt / 1.4);
    char.position.set(1, 0, -1 - 0.5 * e.t);
    MAT.robe.opacity = MAT.scarf.opacity = 1 - e.t;
    return;
  }
  body.position.y = 0;
  body.scale.y = 1 + Math.sin(clock.t * 2.2) * 0.012;
  body.rotation.z = state.shiver > 0 ? Math.sin(clock.t * 50) * 0.08 * state.shiver : 0;
}

// ---------- win / reset ----------
const card = document.getElementById('card');
function win() {
  state.won = true;
  state.winT = 0;
  showHint('');
  Sound.win();
  facing = Math.PI;
  MAT.robe.transparent = MAT.scarf.transparent = true;
  walker.exit = { t: 0 };
  setTimeout(() => {
    if (!state.won) return;
    card.hidden = false;
    requestAnimationFrame(() => card.classList.add('show'));
    document.getElementById('btn-again').focus({ preventScroll: true });
  }, 1900);
}
function reset(data) {
  state.won = false;
  state.winT = -1;
  state.moved = false;
  state.rotated = false;
  state.shake = state.shiver = 0;
  card.classList.remove('show');
  card.hidden = true;
  lampAnim = null;
  walker.step = null;
  walker.path = [];
  walker.pending = null;
  walker.exit = null;
  MAT.robe.transparent = MAT.scarf.transparent = false;
  MAT.robe.opacity = MAT.scarf.opacity = 1;
  doorMat.color.copy(doorFrom);
  body.rotation.z = 0;
  let k = START_K, tile = START;
  if (data && Number.isInteger(data.k) && TILES.has(data.tile) && data.tile !== GATE) {
    const s = shadeAt(data.k * STEP);
    if (s.has(data.tile)) { k = data.k; tile = data.tile; }
  }
  walker.tile = tile;
  state.k = k;
  state.theta = k * STEP;
  setLampTheta(state.theta);
  shade = shadeAt(state.theta);
  state.rotated = state.moved = tile !== START;
  tileWorld(tile, char.position);
  facing = char.rotation.y = -Math.PI * 3 / 4;
  flashing = false;
  updateHint();
}

// ---------- input ----------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const lampPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -LAMP_Y);
const tmp = new THREE.Vector3();
function aim(cx, cy) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
}
function hitAt(cx, cy) {
  aim(cx, cy);
  const hits = raycaster.intersectObjects(pickables, false);
  for (const h of hits) {
    if (h.object.userData.lamp) return { lamp: true };
    if (h.object.userData.tile) return { tile: h.object.userData.tile };
    return null;
  }
  return null;
}
function angleAt(cx, cy) {
  aim(cx, cy);
  if (!raycaster.ray.intersectPlane(lampPlane, tmp)) return null;
  return Math.atan2(tmp.z - POST.z, tmp.x - POST.x);
}

let press = null;
canvas.addEventListener('pointerdown', (e) => {
  Sound.ensure();
  if (state.won || press) return;
  const hit = hitAt(e.clientX, e.clientY);
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, hit, moved: 0, dragging: false };
  if (hit && hit.lamp && !walker.step && !lampAnim) {
    press.last = angleAt(e.clientX, e.clientY);
    press.base = state.theta;
    press.acc = 0;
    press.startTheta = state.theta;
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not needed for mouse */ }
});
canvas.addEventListener('pointermove', (e) => {
  if (!press) {
    if (e.pointerType === 'mouse') {
      const h = hitAt(e.clientX, e.clientY);
      canvas.style.cursor = !h ? 'default' : h.lamp ? 'grab' : shade.has(h.tile) ? 'pointer' : 'not-allowed';
    }
    return;
  }
  if (e.pointerId !== press.id) return;
  press.moved = Math.max(press.moved, Math.hypot(e.clientX - press.x, e.clientY - press.y));
  if (!press.dragging && press.base !== undefined && press.moved > 5 && press.last !== null) {
    press.dragging = true;
    canvas.style.cursor = 'grabbing';
  }
  if (!press.dragging) return;
  const a = angleAt(e.clientX, e.clientY);
  if (a === null) return;
  let d = a - press.last;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  press.acc += d;
  press.last = a;
  const r = safeReach(state.theta, press.base + press.acc);
  if (r.angle !== state.theta) {
    if (Math.floor(r.angle / (STEP / 4)) !== Math.floor(state.theta / (STEP / 4))) Sound.tick();
    setLampTheta(r.angle);
  }
  if (r.blocked && !press.warned) { press.warned = true; onBlocked(); }
  if (!r.blocked) press.warned = false;
});
function endPress(e) {
  if (!press || e.pointerId !== press.id) return;
  const p = press;
  press = null;
  canvas.style.cursor = 'default';
  if (p.dragging) {
    const near = Math.round(state.theta / STEP) * STEP;
    const other = state.theta > near ? near + STEP : near - STEP;
    const target = [near, other, Math.round(p.startTheta / STEP) * STEP].find((c) => !safeReach(state.theta, c).blocked);
    animateLamp(target === undefined ? p.startTheta : target);
    return;
  }
  if (e.type === 'pointercancel' || p.moved > 12 || !p.hit) return;
  if (p.hit.lamp) rotateBy(1);
  else if (p.hit.tile) walkTo(p.hit.tile);
}
canvas.addEventListener('pointerup', endPress);
canvas.addEventListener('pointercancel', endPress);

window.addEventListener('keydown', (e) => {
  if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey) {
    Sound.ensure();
    rotateBy(e.shiftKey ? -1 : 1);
  }
});

// ---------- framing ----------
const P = (x, y, z) => new THREE.Vector3(x, y, z);
const FIT_CORE = [P(-1, 4.0, -1), P(6.5, 0, -0.5), P(-0.5, 0, 6.5), P(6.5, -0.9, 6.5), P(3, 3.0, 0)];
const FIT_WIDE = [P(6.5, 3.6, -1.5), P(-1.5, 3.6, 6.5)];
function fit() {
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setSize(W, H);
  const pts = W > H ? FIT_CORE.concat(FIT_WIDE) : FIT_CORE;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  pts.forEach((p) => {
    const x = p.dot(SCREEN_R), y = p.dot(SCREEN_U);
    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    minY = Math.min(minY, y); maxY = Math.max(maxY, y);
  });
  const padTop = Math.min(110, H * 0.13), padBottom = Math.min(90, H * 0.11), padSide = W > H ? Math.max(24, W * 0.05) : 10;
  const availW = W - padSide * 2, availH = H - padTop - padBottom;
  const ppu = Math.min(availW / (maxX - minX), availH / (maxY - minY));
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  camera.left = cx - W / 2 / ppu;
  camera.right = cx + W / 2 / ppu;
  camera.top = cy + (padTop + availH / 2) / ppu;
  camera.bottom = camera.top - H / ppu;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', fit);

// ---------- loop ----------
const clock = { last: performance.now(), t: 0 };
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - clock.last) / 1000));
  clock.last = now;
  tickWorld(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
function tickWorld(dt) {
  clock.t += dt;
  if (lampAnim) {
    const a = lampAnim;
    a.t = Math.min(1, a.t + dt / a.dur);
    const k = 1 - Math.pow(1 - a.t, 3);
    setLampTheta(a.from + (a.to - a.from) * k);
    if (a.t >= 1) { lampAnim = null; settleLamp(a.to); }
  }
  updateWalker(dt);
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i];
    f.t = Math.min(1, f.t + dt / 0.6);
    f.m.material.opacity = 0.55 * (1 - f.t);
    if (f.t >= 1) { scene.remove(f.m); f.m.material.dispose(); flashes.splice(i, 1); }
  }
  state.shake = Math.max(0, state.shake - dt * 2.5);
  state.shiver = Math.max(0, state.shiver - dt * 1.8);
  orb.position.y = Math.sin(clock.t * 40) * 0.04 * state.shake + Math.sin(clock.t * 1.4) * 0.012;
  if (state.winT >= 0) {
    state.winT = Math.min(1, state.winT + dt / 1.6);
    const k = state.winT * state.winT * (3 - 2 * state.winT);
    doorMat.color.copy(doorFrom).lerp(doorTo, k);
  }
}

// ---------- boot ----------
function start(data) {
  reset(data);
  fit();
  requestAnimationFrame((t) => { clock.last = t; loop(t); });
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ k: state.k, tile: walker.tile }));
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});

</script>
