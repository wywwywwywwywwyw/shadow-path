<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>影径</title>
<meta name="description" content="一个关于光与影的等距小游戏：墨水小精灵只能待在影子里，转动光球，让回廊里雕塑的影子替它铺出一条回家的路。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Serif+SC:wght@300;500&display=swap">
<style>
  :root {
    /* Layout: full-bleed night with the moonlit court as the only subject; HUD in the corners, end card as a centred veil */
    --sky-1: #070b1e;
    --sky-2: #141b3a;
    --sky-3: #2a2448;
    --mist-0: rgba(42, 36, 72, 0);
    --ink: #f1e9dc;
    --ink-soft: rgba(241, 233, 220, 0.6);
    --ember: #f4a965;
    --glass: rgba(20, 24, 54, 0.5);
    --glass-strong: rgba(40, 44, 90, 0.82);
    --line: rgba(241, 233, 220, 0.2);
    --veil: rgba(9, 12, 32, 0.8);
    --font-cn: "Noto Serif SC", "Songti SC", "STSong", serif;
    --font-latin: "Marcellus", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--sky-2);
    background-image: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 55%, var(--sky-3) 100%);
    color: var(--ink);
    font-family: var(--font-cn);
    font-weight: 300;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage { position: fixed; inset: 0; z-index: 1; }
  #stage canvas { display: block; touch-action: none; outline: none; }

  .mist {
    position: fixed; left: 0; right: 0; bottom: 0; height: 26vh; z-index: 2; pointer-events: none;
    background: linear-gradient(to bottom, var(--mist-0) 0%, var(--sky-3) 92%);
  }

  .hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
    padding-left: max(22px, env(safe-area-inset-left, 0px));
    padding-right: max(22px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .title h1 {
    margin: 0;
    font: 500 clamp(28px, 3.4vw, 36px)/1 var(--font-cn);
    letter-spacing: 0.42em;
    color: var(--ink);
  }
  .title p {
    margin: 10px 0 0;
    font: 400 11px/1.4 var(--font-latin);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .actions { display: flex; gap: 10px; }
  .icon-btn {
    width: 42px; height: 42px; padding: 0;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--glass);
    color: var(--ink);
    cursor: pointer;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: background-color 0.2s, transform 0.2s;
  }
  .icon-btn:hover { background: var(--glass-strong); transform: translateY(-1px); }
  .icon-btn:focus-visible, .text-btn:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn .off { display: none; }
  .icon-btn[aria-pressed="false"] .on { display: none; }
  .icon-btn[aria-pressed="false"] .off { display: block; }

  .hint {
    position: fixed; left: 0; right: 0; z-index: 3; margin: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
    font: 300 15px/1.6 var(--font-cn);
    letter-spacing: 0.16em;
    color: var(--ink);
    text-shadow: 0 1px 14px rgba(7, 11, 30, 0.95);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.45s ease, transform 0.45s ease;
    pointer-events: none;
  }
  .hint.show { opacity: 0.94; transform: none; }
  .hint.warm { color: var(--ember); }

  .card {
    position: fixed; inset: 0; z-index: 4;
    display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: radial-gradient(ellipse at 50% 46%, var(--veil) 0%, var(--veil) 30%, transparent 74%);
    opacity: 0;
    transition: opacity 1s ease;
  }
  .card.show { opacity: 1; }
  .card-inner { display: grid; justify-items: center; gap: 16px; text-align: center; max-width: 30ch; }
  .card .eyebrow {
    margin: 0;
    font: 400 11px/1.4 var(--font-latin);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .card h2 {
    margin: 0;
    font: 300 clamp(52px, 10vw, 76px)/1 var(--font-cn);
    letter-spacing: 0.36em;
    padding-left: 0.36em;
    color: var(--ink);
  }
  .card .line { margin: 0; font-size: 15px; line-height: 1.9; letter-spacing: 0.1em; color: var(--ink); }
  .text-btn {
    margin-top: 10px;
    font: 300 14px/1 var(--font-cn);
    letter-spacing: 0.3em;
    padding: 13px 22px 13px 26px;
    border-radius: 999px;
    border: 1px solid var(--ink-soft);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s;
  }
  .text-btn:hover { background: var(--ink); color: var(--sky-1); }

  @media (max-width: 480px) {
    .title h1 { letter-spacing: 0.32em; }
    .hint { font-size: 14px; letter-spacing: 0.1em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hint, .card { transition: none; }
  }
</style>
</head>
<body>

<div id="stage"></div>
<div class="mist" aria-hidden="true"></div>

<header class="hud">
  <div class="title">
    <h1>影径</h1>
    <p>The Shadow Path · I</p>
  </div>
  <div class="actions">
    <button id="btn-sound" class="icon-btn" type="button" aria-pressed="true" aria-label="声音">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
    <button id="btn-reset" class="icon-btn" type="button" aria-label="重新开始">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg>
    </button>
  </div>
</header>

<p id="hint" class="hint" aria-live="polite"></p>

<section id="card" class="card" hidden aria-live="polite">
  <div class="card-inner">
    <p class="eyebrow">Chapter I · Complete</p>
    <h2>归处</h2>
    <p class="line">小墨跟着影子穿过回廊，<br>回到了属于它的暗处。</p>
    <button id="btn-again" class="text-btn" type="button">再走一次</button>
  </div>
</section>

<script>
  // if the module below never boots (offline, blocked CDN), say so instead of showing an empty night
  setTimeout(function () {
    if (window.__spireBooted) return;
    var h = document.getElementById('hint');
    h.textContent = '3D 引擎没能加载，请检查网络后刷新页面';
    h.classList.add('show');
  }, 9000);
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const hintEl = document.getElementById('hint');
function fail(msg) {
  hintEl.textContent = msg;
  hintEl.classList.add('show');
}
window.__spireBooted = true;

// ---------- level ----------
const TAU = Math.PI * 2;
const STEP = Math.PI / 4;             // the orb rests every 45 degrees
const SWEEP = Math.PI / 180;          // safety check resolution while it moves
const N = 7;
const POST = { x: 3, z: 3 };
const ARM_R = 1.45;
const LAMP_Y = 2.1;
const START = '6,6';
const START_K = 5;
const GATE = '1,-1';
const GATE_IN = '1,0';
const STEP_TIME = 0.4;

// Every occluder is an axis-aligned box. The same boxes cast the rendered
// shadow and decide which tiles it may stand on, so what you see is the rule.
const PILLARS = [
  { x: 3, z: 0, h: 2.7 },
  { x: 1, z: 5, h: 2.7 },
  { x: 3, z: 4, h: 1.2 },
];
const WALLS = [                       // low marble screens running along z
  { x: 2, z0: 1, len: 3, h: 1.0 },
  { x: 4, z0: 2, len: 3, h: 1.0 },
];
const OCCLUDERS = [];
PILLARS.forEach((p) => OCCLUDERS.push({ lo: [p.x - 0.35, 0, p.z - 0.35], hi: [p.x + 0.35, p.h, p.z + 0.35] }));
WALLS.forEach((w) => OCCLUDERS.push({ lo: [w.x - 0.18, 0, w.z0 - 0.5], hi: [w.x + 0.18, w.h, w.z0 + w.len - 0.5] }));

const key = (x, z) => x + ',' + z;
const BLOCKED = new Set([key(POST.x, POST.z)]);
PILLARS.forEach((p) => BLOCKED.add(key(p.x, p.z)));
WALLS.forEach((w) => { for (let i = 0; i < w.len; i++) BLOCKED.add(key(w.x, w.z0 + i)); });
const TILES = new Map();
for (let x = 0; x < N; x++) {
  for (let z = 0; z < N; z++) {
    if (!BLOCKED.has(key(x, z))) TILES.set(key(x, z), { id: key(x, z), x, z });
  }
}
TILES.set(GATE, { id: GATE, x: 1, z: -1, gate: true });

function lampAt(theta, out) {
  out[0] = POST.x + ARM_R * Math.cos(theta);
  out[1] = LAMP_Y;
  out[2] = POST.z + ARM_R * Math.sin(theta);
  return out;
}
function segHitsBox(p, q, lo, hi) {
  let t0 = 0, t1 = 1;
  for (let a = 0; a < 3; a++) {
    const d = q[a] - p[a];
    if (Math.abs(d) < 1e-9) {
      if (p[a] < lo[a] || p[a] > hi[a]) return false;
      continue;
    }
    let ta = (lo[a] - p[a]) / d, tb = (hi[a] - p[a]) / d;
    if (ta > tb) { const s = ta; ta = tb; tb = s; }
    if (ta > t0) t0 = ta;
    if (tb < t1) t1 = tb;
    if (t0 > t1) return false;
  }
  return true;
}
// a tile is shadow when at least 3 of its 5 sample points cannot see the orb
const SAMPLES = [[0, 0], [0.25, 0.25], [-0.25, 0.25], [0.25, -0.25], [-0.25, -0.25]];
const _p = [0, 0.05, 0], _q = [0, 0, 0];
function inShadow(tile, theta) {
  if (tile.gate) return true;
  lampAt(theta, _q);
  let dark = 0;
  for (const s of SAMPLES) {
    _p[0] = tile.x + s[0];
    _p[2] = tile.z + s[1];
    for (const o of OCCLUDERS) {
      if (segHitsBox(_p, _q, o.lo, o.hi)) { dark++; break; }
    }
  }
  return dark >= 3;
}
function shadeAt(theta) {
  const out = new Set();
  TILES.forEach((t) => { if (inShadow(t, theta)) out.add(t.id); });
  return out;
}
function neighbours(id) {
  const t = TILES.get(id), out = [];
  [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dz]) => {
    const n = TILES.get(key(t.x + dx, t.z + dz));
    if (n) out.push(n.id);
  });
  return out;
}
function findPath(from, to, shade) {
  if (from === to) return [from];
  const prev = new Map([[from, null]]);
  const queue = [from];
  while (queue.length) {
    const cur = queue.shift();
    for (const n of neighbours(cur)) {
      if (!shade.has(n) || prev.has(n)) continue;
      prev.set(n, cur);
      if (n === to) {
        const path = [to];
        for (let p = cur; p; p = prev.get(p)) path.unshift(p);
        return path;
      }
      queue.push(n);
    }
  }
  return null;
}

// ---------- renderer ----------
const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (err) {
  fail('这个浏览器没有开启 WebGL，无法显示回廊');
  throw err;
}
const PIXEL_RATIO = Math.min(window.devicePixelRatio || 1, window.innerWidth < 600 ? 1.5 : 2);
renderer.setPixelRatio(PIXEL_RATIO);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
const canvas = renderer.domElement;
canvas.setAttribute('role', 'img');
canvas.setAttribute('aria-label', '月夜里的回廊庭院。墨水小精灵只能待在影子里，拖动或点击光球改变影子，点击发光圆圈标出的石板让它走过去。键盘按 R 转动光球。');
stage.appendChild(canvas);

const ISO = new THREE.Vector3(1, 1, 1).normalize();
const SCREEN_R = new THREE.Vector3(1, 0, -1).normalize();
const SCREEN_U = new THREE.Vector3(-1, 2, -1).normalize();
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-5, 5, 5, -5, 0.1, 500);
camera.position.copy(ISO).multiplyScalar(150);
camera.lookAt(0, 0, 0);

const composer = new EffectComposer(renderer);
composer.setPixelRatio(PIXEL_RATIO);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.55, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

scene.add(new THREE.HemisphereLight(0x4d5fa6, 0x1a1422, 0.85));
const moon = new THREE.DirectionalLight(0x9fb3ff, 0.45);
moon.position.set(-0.45, 1, 0.35);
scene.add(moon);

// ---------- textures ----------
function canvasTexture(w, h, draw, srgb) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const radial = (inner, outer) => canvasTexture(128, 128, (g) => {
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, inner);
  grd.addColorStop(1, outer);
  g.fillStyle = grd;
  g.fillRect(0, 0, 128, 128);
});
function skyTexture(W, H) {
  const s = Math.min(1.5, PIXEL_RATIO), w = Math.round(W * s), h = Math.round(H * s);
  return canvasTexture(w, h, (g) => {
    const grd = g.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, '#070b1e');
    grd.addColorStop(0.55, '#141b3a');
    grd.addColorStop(1, '#2a2448');
    g.fillStyle = grd;
    g.fillRect(0, 0, w, h);
    let seed = 11;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const count = Math.round((W * H) / 4200);
    for (let i = 0; i < count; i++) {
      g.fillStyle = 'rgba(241, 233, 220, ' + (0.12 + rnd() * 0.6).toFixed(2) + ')';
      g.beginPath();
      g.arc(rnd() * w, Math.pow(rnd(), 1.5) * h * 0.85, (0.35 + rnd() * 0.85) * s, 0, TAU);
      g.fill();
    }
    const mx = w * 0.82, my = h * 0.17, mr = Math.min(w, h) * 0.045;
    const halo = g.createRadialGradient(mx, my, mr, mx, my, mr * 5);
    halo.addColorStop(0, 'rgba(230, 226, 214, 0.22)');
    halo.addColorStop(1, 'rgba(230, 226, 214, 0)');
    g.fillStyle = halo;
    g.fillRect(mx - mr * 5, my - mr * 5, mr * 10, mr * 10);
    g.fillStyle = '#ece6d6';
    g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill();
  });
}

// ---------- materials ----------
const std = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85, metalness: 0 }, o || {}));
const MAT = {
  floor: [std(0xb8a68d), std(0xae9c84), std(0xc1af96)],
  plinth: std(0x5c4b40),
  plinthDeep: std(0x3e3330),
  terracotta: std(0xb26c48, { roughness: 0.95 }),
  cornice: std(0xd9c6a8, { roughness: 0.8 }),
  marble: std(0xebe5da, { roughness: 0.42 }),
  marbleWarm: std(0xdcd0bd, { roughness: 0.5 }),
  verde: std(0x2b3a35, { roughness: 0.32 }),
  iron: std(0x1b1b22, { roughness: 0.38, metalness: 0.65 }),
};

// ---------- builders ----------
const BOX = new THREE.BoxGeometry(1, 1, 1);
const pickables = [];
function mesh(geo, mat, parent, opt) {
  opt = opt || {};
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = opt.cast !== false;
  m.receiveShadow = opt.receive !== false;
  (parent || scene).add(m);
  if (opt.pick !== false) pickables.push(m);
  return m;
}
function box(x, y, z, sx, sy, sz, mat, parent, opt) {
  const m = mesh(BOX, mat, parent, opt);
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  return m;
}
// an arched opening as a hole: rectangle from the sill up to the spring line, then a half circle
function archHole(cx, sill, spring, half) {
  const p = new THREE.Path();
  p.moveTo(cx - half, sill);
  p.lineTo(cx + half, sill);
  p.lineTo(cx + half, spring);
  p.absarc(cx, spring, half, 0, Math.PI, false);
  p.lineTo(cx - half, sill);
  return p;
}

// ---------- the court ----------
for (let x = 0; x < N; x++) {
  for (let z = 0; z < N; z++) {
    const slab = box(x, -0.12, z, 0.965, 0.24, 0.965, MAT.floor[(x * 7 + z * 3) % 3]);
    if (TILES.has(key(x, z))) slab.userData.tile = key(x, z);
  }
}
box(1, -0.12, -1, 0.965, 0.24, 1, MAT.floor[0]).userData.tile = GATE;
box(2.5, -0.55, 2.5, 8, 0.62, 8, MAT.plinth, scene, { cast: false });
box(2.5, -1.06, 2.5, 7.3, 0.4, 7.3, MAT.plinthDeep, scene, { cast: false, pick: false });

// back arcade: the doorway reaches the floor, the other arches are windows onto the night
const WALL_H = 2.3;
const backShape = new THREE.Shape();
backShape.moveTo(-1.5, 0);
backShape.lineTo(0.6, 0);
backShape.lineTo(0.6, 1.3);
backShape.absarc(1, 1.3, 0.4, Math.PI, 0, true);
backShape.lineTo(1.4, 0);
backShape.lineTo(6.5, 0);
backShape.lineTo(6.5, WALL_H);
backShape.lineTo(-1.5, WALL_H);
backShape.closePath();
[4.3, 5.7].forEach((cx) => backShape.holes.push(archHole(cx, 0.7, 1.4, 0.3)));
const backWall = mesh(new THREE.ExtrudeGeometry(backShape, { depth: 1, bevelEnabled: false, curveSegments: 24 }), MAT.terracotta);
backWall.position.z = -1.5;
box(2.5, WALL_H + 0.06, -1, 8.16, 0.12, 1.16, MAT.cornice);

// the doorway is filled with ink: the one dark place in the court, where the spirit belongs
const doorMat = new THREE.MeshBasicMaterial({
  map: canvasTexture(16, 128, (g, w, h) => {
    const grd = g.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, '#231f3f');
    grd.addColorStop(1, '#07070f');
    g.fillStyle = grd;
    g.fillRect(0, 0, w, h);
  }),
});
const doorShape = new THREE.Shape();
doorShape.moveTo(-0.4, 0);
doorShape.lineTo(-0.4, 1.3);
doorShape.absarc(0, 1.3, 0.4, Math.PI, 0, true);
doorShape.lineTo(0.4, 0);
doorShape.closePath();
const doorGeo = new THREE.ShapeGeometry(doorShape, 24);
{
  // map the gradient top to bottom across the arch
  const uv = doorGeo.attributes.uv, pos = doorGeo.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, 0.5, pos.getY(i) / 1.7);
}
const door = new THREE.Mesh(doorGeo, doorMat);
door.position.set(1, 0, -0.52);

// ---------- the ink spirit ----------
// Glossy ink: near-black body, a sky reflection that brightens toward the rim,
// a sharp glint and a warm bounce from the orb. The surface wobbles slowly.
// The glint direction is chosen so the highlight lands on the upper-left of the drop
// as seen from this camera: mirror the view direction about a normal that leans that way.
const glintNormal = ISO.clone().multiplyScalar(0.8).addScaledVector(SCREEN_R, -0.4).addScaledVector(SCREEN_U, 0.15).normalize();
const glintDir = glintNormal.clone().multiplyScalar(2 * glintNormal.dot(ISO)).sub(ISO).normalize();
const inkMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uLight: { value: new THREE.Vector3() },
    uView: { value: ISO.clone() },
    uGlint: { value: glintDir },
    uBase: { value: new THREE.Color(0.006, 0.007, 0.016) },
  },
  vertexShader: /* glsl */ `
    uniform float uTime;
    varying vec3 vNormalW;
    varying vec3 vPosW;
    void main() {
      vec3 p = position;
      float ring = atan(p.z, p.x);
      float wobble = sin(p.y * 16.0 + uTime * 2.6) * 0.010 + sin(ring * 3.0 + uTime * 1.7) * 0.012;
      p += normal * wobble * smoothstep(0.02, 0.2, p.y);
      vec4 wp = modelMatrix * vec4(p, 1.0);
      vPosW = wp.xyz;
      vNormalW = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */ `
    uniform vec3 uLight;
    uniform vec3 uView;
    uniform vec3 uGlint;
    uniform vec3 uBase;
    varying vec3 vNormalW;
    varying vec3 vPosW;
    void main() {
      vec3 n = normalize(vNormalW);
      vec3 v = normalize(uView);
      float ndv = clamp(dot(n, v), 0.0, 1.0);
      float fres = pow(1.0 - ndv, 3.0);
      vec3 r = reflect(-v, n);
      vec3 env = mix(vec3(0.015, 0.012, 0.03), vec3(0.22, 0.30, 0.62), smoothstep(-0.3, 0.9, r.y));
      vec3 l = normalize(uLight - vPosW);
      float glint = pow(max(dot(r, uGlint), 0.0), 90.0);
      float sheen = pow(max(dot(r, uGlint), 0.0), 10.0);
      float warm = pow(max(dot(r, l), 0.0), 120.0);
      vec3 col = uBase;
      col += env * (0.06 + 0.95 * fres);
      col += vec3(0.30, 0.36, 0.55) * sheen * 0.25;
      col += vec3(2.2, 2.4, 3.0) * glint;
      col += vec3(1.0, 0.58, 0.28) * (0.05 * max(dot(n, l), 0.0) + 0.5 * warm);
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});

// ---------- sound ----------
const SCALE = [261.63, 329.63, 392.0, 493.88, 587.33, 659.25, 783.99];
const Sound = {
  ctx: null,
  on: true,
  ni: 0,
  ensure() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const c = this.ctx;
    this.master = c.createGain();
    this.master.gain.value = this.on ? 0.9 : 0;
    this.master.connect(c.destination);
    this.dry = c.createGain();
    this.dry.gain.value = 0.75;
    this.dry.connect(this.master);
    const verb = c.createConvolver();
    verb.buffer = this.impulse(3.8);
    this.wet = c.createGain();
    this.wet.gain.value = 0.5;
    this.wet.connect(verb);
    verb.connect(this.master);
    this.ambience();
  },
  impulse(sec) {
    const c = this.ctx, n = Math.floor(c.sampleRate * sec), buf = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    }
    return buf;
  },
  send(node) { node.connect(this.dry); node.connect(this.wet); },
  // a soft felt-piano note: a few sine partials through a gentle low-pass
  piano(freq, delay, vol, decay) {
    const c = this.ctx;
    if (!c) return;
    decay = decay || 2.2;
    const t = c.currentTime + (delay || 0), g = c.createGain(), lp = c.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 2400;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    [[1, 1], [2, 0.32], [3, 0.1], [4.02, 0.04]].forEach(([m, a]) => {
      const o = c.createOscillator(), og = c.createGain();
      o.frequency.value = freq * m;
      og.gain.value = a;
      o.connect(og);
      og.connect(g);
      o.start(t);
      o.stop(t + decay + 0.1);
    });
    g.connect(lp);
    this.send(lp);
  },
  drip() {
    const c = this.ctx;
    if (!c) return;
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(1300 + Math.random() * 300, t);
    o.frequency.exponentialRampToValueAtTime(480, t + 0.07);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    o.connect(g);
    this.send(g);
    o.start(t);
    o.stop(t + 0.12);
  },
  glass() {
    const c = this.ctx;
    if (!c) return;
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.frequency.value = 3100 + Math.random() * 400;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.012, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g);
    this.send(g);
    o.start(t);
    o.stop(t + 0.06);
  },
  step() { this.drip(); },
  arrive() { this.ni = (this.ni + 1) % SCALE.length; this.piano(SCALE[this.ni], 0, 0.07); },
  creak() { this.glass(); },
  rest() { this.piano(1046.5, 0, 0.035, 2.6); },
  blocked() { this.piano(130.81, 0, 0.09, 1.2); this.piano(138.59, 0.015, 0.06, 1.2); },
  nope() { this.piano(196, 0, 0.05, 0.8); },
  win() {
    [261.63, 392, 493.88, 587.33, 783.99, 987.77].forEach((f, i) => this.piano(f, i * 0.18, 0.08, 3));
    this.piano(130.81, 1.1, 0.06, 4);
  },
  ambience() {
    const c = this.ctx, t = c.currentTime;
    const g = c.createGain(), lp = c.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 800;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.022, t + 5);
    [130.81, 196, 329.63, 493.88].forEach((f, i) => {
      [-3, 3].forEach((cents) => {
        const o = c.createOscillator();
        o.frequency.value = f;
        o.detune.value = cents + i;
        o.connect(lp);
        o.start(t);
      });
    });
    const lfo = c.createOscillator(), depth = c.createGain();
    lfo.frequency.value = 0.05;
    depth.gain.value = 280;
    lfo.connect(depth);
    depth.connect(lp.frequency);
    lfo.start(t);
    lp.connect(g);
    this.send(g);
  },
  toggle(on) {
    this.on = on;
    if (this.master) this.master.gain.setTargetAtTime(on ? 0.9 : 0, this.ctx.currentTime, 0.08);
  },
};

// ---------- state ----------
const state = { theta: START_K * STEP, k: START_K, won: false, moved: false, rotated: false, winT: -1, shake: 0, shiver: 0, land: 0, blinkAt: 2 };
let shade = new Set();
let liveShade = new Set();
const walker = { tile: START, step: null, path: [], pending: null, exit: null };
let lampAnim = null;
const mod8 = (k) => ((k % 8) + 8) % 8;

function tileWorld(id, out) {
  const t = TILES.get(id);
  return out.set(t.x, 0, t.z);
}
function setLampTheta(theta) {
  state.theta = theta;
  arm.rotation.y = -theta;
  renderer.shadowMap.needsUpdate = true;
  liveShade = shadeAt(theta);
}
// how far the orb can travel toward `to` before its light would reach the spirit
function safeReach(from, to) {
  const tile = TILES.get(walker.tile);
  const dir = Math.sign(to - from);
  let a = from;
  while (Math.abs(to - a) > 1e-9) {
    const next = Math.abs(to - a) <= SWEEP ? to : a + dir * SWEEP;
    if (!inShadow(tile, next)) return { angle: a, blocked: true };
    a = next;
  }
  return { angle: a, blocked: false };
}
function settleLamp(theta) {
  const before = state.k;
  state.k = mod8(Math.round(theta / STEP));
  setLampTheta(theta);
  shade = shadeAt(theta);
  if (state.k !== before) {
    state.rotated = true;
    hintRing.visible = false;
    Sound.rest();
  }
  updateHint();
}
function animateLamp(to, dur) {
  lampAnim = { from: state.theta, to, t: 0, dur: dur || 0.32 + 0.3 * Math.min(2, Math.abs(to - state.theta) / STEP) };
}
function rotateBy(n) {
  if (state.won || walker.step || lampAnim) return;
  const target = (Math.round(state.theta / STEP) + n) * STEP;
  const r = safeReach(state.theta, target);
  if (r.blocked) { onBlocked(); return; }
  animateLamp(target);
}
function onBlocked() {
  state.shake = 1;
  state.shiver = 1;
  Sound.blocked();
  flashHint('再转下去，光就会照到它', true);
}

// ---------- hints ----------
let hintTimer = 0, flashTimer = 0, flashing = false;
function showHint(text, warm) {
  if (hintEl.dataset.text === text && hintEl.classList.contains('warm') === !!warm) return;
  hintEl.dataset.text = text;
  hintEl.classList.remove('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => {
    hintEl.textContent = text;
    hintEl.classList.toggle('warm', !!warm);
    if (text) hintEl.classList.add('show');
  }, 220);
}
function flashHint(text, warm) {
  flashing = true;
  showHint(text, warm);
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { flashing = false; updateHint(); }, 2400);
}
function updateHint() {
  if (flashing) return;
  if (state.won) return showHint('');
  if (!state.rotated && !state.moved) return showHint('小墨只能待在影子里。拖动光球，影子会跟着转');
  if (findPath(walker.tile, GATE_IN, shade)) return showHint('暗门就在前面');
  if (state.rotated && !state.moved) return showHint('点发光圆圈标出的石板，带它过去');
  return showHint('一边转动光球，一边走向暗门');
}

// ---------- walking ----------
const fx = [];
const RING = new THREE.RingGeometry(0.17, 0.21, 48);
RING.rotateX(-Math.PI / 2);
function ripple(id, color) {
  const m = new THREE.Mesh(RING, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending }));
  tileWorld(id, m.position);
  m.position.y = 0.02;
  m.renderOrder = 5;
  scene.add(m);
  fx.push({ m, t: 0 });
}
function walkTo(id) {
  if (state.won || lampAnim || (press && press.dragging)) return;
  if (!shade.has(id)) {
    ripple(id, 0xffa860);
    Sound.nope();
    flashHint('那里有光，它过不去', true);
    return;
  }
  ripple(id, 0xa9c2ff);
  if (walker.step) { walker.pending = id; return; }
  if (id === walker.tile) return;
  const path = findPath(walker.tile, id, shade);
  if (!path) {
    Sound.nope();
    flashHint('影子没有连到那里，转一转光球', true);
    return;
  }
  walker.path = path.slice(1);
  nextStep();
}
function nextStep() {
  if (walker.pending) {
    const p = findPath(walker.tile, walker.pending, shade);
    walker.pending = null;
    walker.path = p ? p.slice(1) : [];
  }
  if (!walker.path.length) { updateHint(); return; }
  const to = walker.path.shift();
  const a = tileWorld(walker.tile, new THREE.Vector3()), b = tileWorld(to, new THREE.Vector3());
  const screenDx = (b.x - a.x) - (b.z - a.z);
  if (screenDx !== 0) look(screenDx > 0 ? 1 : -1);
  walker.step = { to, a, b, t: 0 };
  state.moved = true;
}
function updateWalker(dt) {
  const s = walker.step;
  state.land = Math.max(0, state.land - dt * 5);
  if (s) {
    s.t = Math.min(1, s.t + dt / STEP_TIME);
    char.position.lerpVectors(s.a, s.b, s.t);
    const hop = Math.sin(s.t * Math.PI);
    blob.position.y = hop * 0.08;
    blob.scale.set(1 - 0.06 * hop, 1 + 0.12 * hop, 1 - 0.06 * hop);
    contact.scale.setScalar(1 - 0.3 * hop);
    if (s.t >= 1) {
      walker.tile = s.to;
      walker.step = null;
      state.land = 1;
      Sound.step();
      stain(s.b.x, s.b.z);
      if (s.to === GATE) { win(); return; }
      nextStep();
      if (!walker.step) Sound.arrive();
    }
    return;
  }
  if (walker.exit) {
    const e = walker.exit;
    e.t = Math.min(1, e.t + dt / 1.3);
    char.position.set(1, 0, -1 - 0.7 * e.t);
    blob.scale.setScalar(Math.max(0.001, 1 - e.t));
    contact.scale.setScalar(Math.max(0.001, 1 - e.t));
    return;
  }
  const sh = state.shiver;
  blob.position.y = 0;
  contact.scale.setScalar(1);
  const breathe = Math.sin(clock.t * 2.2) * 0.02;
  const jiggle = sh > 0 ? Math.sin(clock.t * 55) * 0.08 * sh : 0;
  blob.scale.set(1 + 0.08 * state.land + jiggle - breathe / 2, 1 - 0.14 * state.land + breathe, 1 + 0.08 * state.land - jiggle - breathe / 2);
}

// ---------- win / reset ----------
const card = document.getElementById('card');
function win() {
  state.won = true;
  state.winT = 0;
  showHint('');
  Sound.win();
  walker.exit = { t: 0 };
  setTimeout(() => {
    if (!state.won) return;
    card.hidden = false;
    requestAnimationFrame(() => card.classList.add('show'));
    document.getElementById('btn-again').focus({ preventScroll: true });
  }, 2000);
}
function reset(data) {
  state.won = false;
  state.winT = -1;
  state.moved = false;
  state.rotated = false;
  state.shake = state.shiver = state.land = 0;
  card.classList.remove('show');
  card.hidden = true;
  lampAnim = null;
  walker.step = null;
  walker.path = [];
  walker.pending = null;
  walker.exit = null;
  blob.scale.setScalar(1);
  blob.position.y = 0;
  contact.scale.setScalar(1);
  doorMat.color.setRGB(1, 1, 1);
  clearStains();
  look(-1);
  let k = START_K, tile = START;
  if (data && Number.isInteger(data.k) && TILES.has(data.tile) && data.tile !== GATE) {
    const s = shadeAt(data.k * STEP);
    if (s.has(data.tile)) { k = data.k; tile = data.tile; }
  }
  walker.tile = tile;
  state.k = k;
  state.theta = k * STEP;
  setLampTheta(state.theta);
  shade = shadeAt(state.theta);
  state.rotated = state.moved = tile !== START;
  hintRing.visible = !state.rotated;
  tileWorld(tile, char.position);
  flashing = false;
  updateHint();
}

// ---------- input ----------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const lampPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -LAMP_Y);
const tmp = new THREE.Vector3();
function aim(cx, cy) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
}
function hitAt(cx, cy) {
  aim(cx, cy);
  const hits = raycaster.intersectObjects(pickables, false);
  for (const h of hits) {
    if (h.object.userData.lamp) return { lamp: true };
    if (h.object.userData.tile) return { tile: h.object.userData.tile };
    return null;
  }
  return null;
}
function angleAt(cx, cy) {
  aim(cx, cy);
  if (!raycaster.ray.intersectPlane(lampPlane, tmp)) return null;
  return Math.atan2(tmp.z - POST.z, tmp.x - POST.x);
}

let press = null;
canvas.addEventListener('pointerdown', (e) => {
  Sound.ensure();
  if (state.won || press) return;
  const hit = hitAt(e.clientX, e.clientY);
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, hit, moved: 0, dragging: false };
  if (hit && hit.lamp && !walker.step && !lampAnim) {
    press.last = angleAt(e.clientX, e.clientY);
    press.base = state.theta;
    press.acc = 0;
    press.startTheta = state.theta;
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not needed for mouse */ }
});
canvas.addEventListener('pointermove', (e) => {
  if (!press) {
    if (e.pointerType === 'mouse') {
      const h = hitAt(e.clientX, e.clientY);
      canvas.style.cursor = !h ? 'default' : h.lamp ? 'grab' : shade.has(h.tile) ? 'pointer' : 'not-allowed';
    }
    return;
  }
  if (e.pointerId !== press.id) return;
  press.moved = Math.max(press.moved, Math.hypot(e.clientX - press.x, e.clientY - press.y));
  if (!press.dragging && press.base !== undefined && press.moved > 5 && press.last !== null) {
    press.dragging = true;
    canvas.style.cursor = 'grabbing';
  }
  if (!press.dragging) return;
  const a = angleAt(e.clientX, e.clientY);
  if (a === null) return;
  let d = a - press.last;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  press.acc += d;
  press.last = a;
  const r = safeReach(state.theta, press.base + press.acc);
  if (r.angle !== state.theta) {
    if (Math.floor(r.angle / (STEP / 6)) !== Math.floor(state.theta / (STEP / 6))) Sound.creak();
    setLampTheta(r.angle);
  }
  if (r.blocked && !press.warned) { press.warned = true; onBlocked(); }
  if (!r.blocked) press.warned = false;
});
function endPress(e) {
  if (!press || e.pointerId !== press.id) return;
  const p = press;
  press = null;
  canvas.style.cursor = 'default';
  if (p.dragging) {
    const near = Math.round(state.theta / STEP) * STEP;
    const other = state.theta > near ? near + STEP : near - STEP;
    const target = [near, other, Math.round(p.startTheta / STEP) * STEP].find((c) => !safeReach(state.theta, c).blocked);
    animateLamp(target === undefined ? p.startTheta : target);
    return;
  }
  if (e.type === 'pointercancel' || p.moved > 12 || !p.hit) return;
  if (p.hit.lamp) rotateBy(1);
  else if (p.hit.tile) walkTo(p.hit.tile);
}
canvas.addEventListener('pointerup', endPress);
canvas.addEventListener('pointercancel', endPress);

window.addEventListener('keydown', (e) => {
  if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey) {
    Sound.ensure();
    rotateBy(e.shiftKey ? -1 : 1);
  }
});
const soundBtn = document.getElementById('btn-sound');
soundBtn.addEventListener('click', () => {
  const on = soundBtn.getAttribute('aria-pressed') !== 'true';
  soundBtn.setAttribute('aria-pressed', String(on));
  soundBtn.setAttribute('aria-label', on ? '声音' : '已静音');
  Sound.toggle(on);
  Sound.ensure();
});
document.getElementById('btn-reset').addEventListener('click', () => { Sound.ensure(); reset(); });
document.getElementById('btn-again').addEventListener('click', () => { Sound.ensure(); reset(); });

// ---------- framing ----------
const P = (x, y, z) => new THREE.Vector3(x, y, z);
const FIT_CORE = [P(-1.5, 2.4, -1.5), P(6.5, 0, -0.5), P(-0.5, 0, 6.5), P(6.5, -0.9, 6.5), P(3, 3.2, 0)];
const FIT_WIDE = [P(6.5, 2.4, -1.5), P(-1.5, 2.4, 6.5)];
function fit() {
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setSize(W, H);
  composer.setSize(W, H);
  if (scene.background) scene.background.dispose();
  scene.background = skyTexture(W, H);
  const pts = W > H ? FIT_CORE.concat(FIT_WIDE) : FIT_CORE;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  pts.forEach((p) => {
    const x = p.dot(SCREEN_R), y = p.dot(SCREEN_U);
    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    minY = Math.min(minY, y); maxY = Math.max(maxY, y);
  });
  const padTop = Math.min(110, H * 0.13), padBottom = Math.min(90, H * 0.11), padSide = W > H ? Math.max(24, W * 0.05) : 10;
  const availW = W - padSide * 2, availH = H - padTop - padBottom;
  const ppu = Math.min(availW / (maxX - minX), availH / (maxY - minY));
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  camera.left = cx - W / 2 / ppu;
  camera.right = cx + W / 2 / ppu;
  camera.top = cy + (padTop + availH / 2) / ppu;
  camera.bottom = camera.top - H / ppu;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', fit);

// ---------- loop ----------
const clock = { last: performance.now(), t: 0 };
const orbWorld = new THREE.Vector3();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - clock.last) / 1000));
  clock.last = now;
  tickWorld(dt);
  composer.render();
  requestAnimationFrame(loop);
}
function tickWorld(dt) {
  clock.t += dt;
  if (lampAnim) {
    const a = lampAnim;
    a.t = Math.min(1, a.t + dt / a.dur);
    const k = 1 - Math.pow(1 - a.t, 3);
    setLampTheta(a.from + (a.to - a.from) * k);
    if (a.t >= 1) { lampAnim = null; settleLamp(a.to); }
  }
  updateWalker(dt);

  // markers follow the live shadow, so they move while the orb swings
  TILES.forEach((t) => {
    const target = liveShade.has(t.id) ? 1 : 0;
    t.lit += (target - t.lit) * Math.min(1, dt * 10);
    t.marker.material.opacity = t.lit * (0.4 + 0.08 * Math.sin(clock.t * 2 + t.x + t.z));
  });
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i];
    f.t = Math.min(1, f.t + dt / 0.7);
    f.m.scale.setScalar(1 + 0.8 * (1 - Math.pow(1 - f.t, 3)));
    f.m.material.opacity = 0.9 * (1 - f.t);
    if (f.t >= 1) { scene.remove(f.m); f.m.material.dispose(); fx.splice(i, 1); }
  }
  for (let i = stains.length - 1; i >= 0; i--) {
    const s = stains[i];
    s.t += dt / 6;
    s.m.material.opacity = 0.85 * Math.max(0, 1 - s.t);
    if (s.t >= 1) { scene.remove(s.m); s.m.material.dispose(); stains.splice(i, 1); }
  }

  // blink now and then
  if (clock.t > state.blinkAt) {
    const b = clock.t - state.blinkAt;
    eyes.scale.y = b < 0.12 ? 0.12 : 1;
    if (b >= 0.12) state.blinkAt = clock.t + 2.5 + Math.random() * 3;
  }

  orb.getWorldPosition(orbWorld);
  inkMat.uniforms.uLight.value.copy(orbWorld);
  inkMat.uniforms.uTime.value = clock.t;

  state.shake = Math.max(0, state.shake - dt * 2.5);
  state.shiver = Math.max(0, state.shiver - dt * 1.8);
  orb.position.y = Math.sin(clock.t * 40) * 0.04 * state.shake + Math.sin(clock.t * 1.4) * 0.012;
  lampLight.intensity = state.won ? 9 : 14;
  if (hintRing.visible) {
    const p = (clock.t % 1.8) / 1.8;
    hintRing.scale.setScalar(0.8 + p * 0.9);
    hintRing.material.opacity = 0.7 * (1 - p);
  }
  for (let i = 0; i < MOTES; i++) {
    const s = moteSeed[i];
    motePos[i * 3] = s[0] + Math.sin(clock.t * 0.25 + s[3]) * 0.4;
    motePos[i * 3 + 1] = s[1] + Math.sin(clock.t * 0.4 + s[3] * 2) * 0.25;
    motePos[i * 3 + 2] = s[2] + Math.cos(clock.t * 0.22 + s[3]) * 0.4;
  }
  moteGeo.attributes.position.needsUpdate = true;
  if (state.winT >= 0) {
    state.winT = Math.min(1, state.winT + dt / 1.8);
    const k = state.winT * state.winT * (3 - 2 * state.winT);
    doorMat.color.setRGB(1 + 2.5 * k, 1 + 2 * k, 1 + 4 * k);
  }
}

// ---------- boot ----------
function start(data) {
  reset(data);
  fit();
  requestAnimationFrame((t) => { clock.last = t; loop(t); });
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ k: state.k, tile: walker.tile }));
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});

</script>
</body>
