<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>影径</title>
<meta name="description" content="一个关于光与影的等距小游戏：旅人只能走在影子里，转动光球、推动小塔，让影子替她铺出一条通往那扇门的路。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=ZCOOL+XiaoWei&display=swap">
<style>
  :root {
    /* Layout: full-bleed sky with the floating court as the only subject; HUD pinned to the corners, end card as a centred veil.
       Each chapter swaps the sky and ink tokens below from script. */
    --sky-1: #ffe2cb;
    --sky-2: #f6bdb3;
    --sky-3: #bcaadb;
    --mist-0: rgba(188, 170, 219, 0);
    --sun: #fff4e2;
    --sun-halo: rgba(255, 236, 214, 0.55);
    --cloud: rgba(255, 247, 243, 0.62);
    --ink: #463d70;
    --ink-soft: #776c9c;
    --warm: #c2553f;
    --glass: rgba(255, 249, 245, 0.55);
    --glass-strong: rgba(255, 249, 245, 0.85);
    --line: rgba(70, 61, 112, 0.18);
    --veil: rgba(255, 241, 234, 0.82);
    --font-display: "ZCOOL XiaoWei", "Songti SC", "STSong", "Noto Serif SC", serif;
    --font-latin: "Marcellus", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    color-scheme: light;
  }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--sky-2);
    background-image: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 52%, var(--sky-3) 100%);
    color: var(--ink);
    font-family: var(--font-display);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .sun {
    position: absolute; width: 46vmin; height: 46vmin; left: 58%; top: 7%;
    border-radius: 50%;
    background: radial-gradient(circle, var(--sun) 0 28%, var(--sun-halo) 29%, transparent 68%);
  }
  .cloud {
    position: absolute; height: 8vmin; border-radius: 999px;
    background: var(--cloud); filter: blur(7px);
    animation: drift 150s linear infinite alternate;
  }
  .c1 { width: 40vmin; top: 24%; left: -10%; }
  .c2 { width: 28vmin; top: 47%; left: 72%; animation-duration: 190s; animation-direction: alternate-reverse; }
  .c3 { width: 58vmin; top: 66%; left: 6%; opacity: 0.75; animation-duration: 220s; }
  @keyframes drift { to { transform: translateX(16vw); } }

  #stage { position: fixed; inset: 0; z-index: 1; transition: opacity 0.45s ease; }
  #stage.fading { opacity: 0; }
  #stage canvas { display: block; touch-action: none; outline: none; }

  .mist {
    position: fixed; left: 0; right: 0; bottom: 0; height: 26vh; z-index: 2; pointer-events: none;
    background: linear-gradient(to bottom, var(--mist-0) 0%, var(--sky-3) 86%);
  }

  .hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .title h1 {
    margin: 0;
    font: 400 clamp(24px, 3.2vw, 32px)/1.1 var(--font-display);
    letter-spacing: 0.3em;
    color: var(--ink);
  }
  .title p {
    margin: 8px 0 0;
    font: 400 11px/1.4 var(--font-latin);
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .actions { display: flex; gap: 10px; }
  .icon-btn {
    width: 42px; height: 42px; padding: 0;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--glass);
    color: var(--ink);
    cursor: pointer;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: background-color 0.2s, transform 0.2s;
  }
  .icon-btn:hover { background: var(--glass-strong); transform: translateY(-1px); }
  .icon-btn:focus-visible, .text-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn .off { display: none; }
  .icon-btn[aria-pressed="false"] .on { display: none; }
  .icon-btn[aria-pressed="false"] .off { display: block; }

  .hint {
    position: fixed; left: 0; right: 0; z-index: 3; margin: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
    font: 400 16px/1.5 var(--font-display);
    letter-spacing: 0.22em;
    color: var(--ink);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.45s ease, transform 0.45s ease;
    pointer-events: none;
  }
  .hint.show { opacity: 0.92; transform: none; }
  .hint.warm { color: var(--warm); }

  .card {
    position: fixed; inset: 0; z-index: 4;
    display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: radial-gradient(ellipse at 50% 45%, var(--veil) 0%, var(--veil) 28%, transparent 72%);
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  .card.show { opacity: 1; }
  .card-inner { display: grid; justify-items: center; gap: 14px; text-align: center; max-width: 30ch; }
  .card .eyebrow {
    margin: 0;
    font: 400 11px/1.4 var(--font-latin);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .card h2 {
    margin: 0;
    font: 400 clamp(40px, 8vw, 60px)/1 var(--font-display);
    letter-spacing: 0.3em;
    padding-left: 0.3em;
    color: var(--ink);
  }
  .card .line { margin: 0; font-size: 16px; line-height: 1.8; letter-spacing: 0.12em; color: var(--ink); }
  .card-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 10px; }
  .text-btn {
    font: 400 15px/1 var(--font-display);
    letter-spacing: 0.3em;
    padding: 13px 22px 13px 26px;
    border-radius: 999px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s;
  }
  .text-btn:hover { background: var(--ink); color: var(--sky-1); }
  .text-btn.primary { background: var(--ink); color: var(--sky-1); }
  .text-btn.primary:hover { background: transparent; color: var(--ink); }

  @media (max-width: 480px) {
    .title h1 { letter-spacing: 0.22em; }
    .hint { font-size: 15px; letter-spacing: 0.14em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud { animation: none; }
    .hint, .card, #stage { transition: none; }
  }
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
</div>

<div id="stage"></div>
<div class="mist" aria-hidden="true"></div>

<header class="hud">
  <div class="title">
    <h1>影径</h1>
    <p id="chapter">The Shadow Path · I</p>
  </div>
  <div class="actions">
    <button id="btn-sound" class="icon-btn" type="button" aria-pressed="true" aria-label="声音">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
    <button id="btn-reset" class="icon-btn" type="button" aria-label="重新开始这一关">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg>
    </button>
  </div>
</header>

<p id="hint" class="hint" aria-live="polite"></p>

<section id="card" class="card" hidden aria-live="polite">
  <div class="card-inner">
    <p class="eyebrow" id="card-eyebrow"></p>
    <h2 id="card-title"></h2>
    <p class="line" id="card-line"></p>
    <div class="card-actions">
      <button id="btn-next" class="text-btn primary" type="button">下一关</button>
      <button id="btn-again" class="text-btn" type="button">再走一次</button>
    </div>
  </div>
</section>

<script>
  // if the module below never boots (offline, blocked CDN), say so instead of showing an empty sky
  setTimeout(function () {
    if (window.__spireBooted) return;
    var h = document.getElementById('hint');
    h.textContent = '3D 引擎没能加载，请检查网络后刷新页面';
    h.classList.add('show');
  }, 9000);
</script>

<script type="module">
import * as THREE from 'three';

const hintEl = document.getElementById('hint');
function fail(msg) {
  hintEl.textContent = msg;
  hintEl.classList.add('show');
}
window.__spireBooted = true;

const TAU = Math.PI * 2;
const STEP = Math.PI / 4;             // the orb rests every 45 degrees
const SWEEP = Math.PI / 180;          // safety check resolution while the orb moves
const SLIDE_STEP = 0.02;              // safety check resolution while the tower slides
const N = 7;
const LAMP_Y = 2.1;
const STEP_TIME = 0.42;

// ---------- chapters ----------
// Both layouts were found and checked by a solver: each needs every mechanism it offers.
const THEMES = [
  {
    css: { '--sky-1': '#ffe2cb', '--sky-2': '#f6bdb3', '--sky-3': '#bcaadb', '--mist-0': 'rgba(188, 170, 219, 0)', '--ink': '#463d70', '--ink-soft': '#776c9c', '--warm': '#c2553f', '--veil': 'rgba(255, 241, 234, 0.82)', '--line': 'rgba(70, 61, 112, 0.18)' },
    floor: [0xf6ecf2, 0xefe3ec], plinth: 0xead8e4, plinthDeep: 0xdcc6da, stone: 0xf4e9f2, stoneWarm: 0xf0dee4,
    roofA: 0xe9907c, roofB: 0x5a5596, move: 0x9fd3c7, groove: 0xbfa9c6, window: 0x8a7fb3, frame: 0xd9c9e3, door: 0x3f3a6e,
    hemi: [0xe6dbff, 0xd6c6e6], orb: 0xffc08a, warm: 0xffb4a2,
    light: { hemi: 1.1, key: 0.75, orb: 3.4 },
  },
  {
    css: { '--sky-1': '#fff1d6', '--sky-2': '#c4ead9', '--sky-3': '#8ab9cf', '--mist-0': 'rgba(138, 185, 207, 0)', '--ink': '#22485a', '--ink-soft': '#4f7584', '--warm': '#c0532f', '--veil': 'rgba(246, 252, 248, 0.84)', '--line': 'rgba(34, 72, 90, 0.18)' },
    floor: [0xf7efe2, 0xeee3d1], plinth: 0xe8dcc6, plinthDeep: 0xd5c7ab, stone: 0xf8f1e6, stoneWarm: 0xf0e3cf,
    roofA: 0xe8875c, roofB: 0x2f7480, move: 0xf2917a, groove: 0xb59f7c, window: 0x5f97a0, frame: 0xcfe3df, door: 0x24485a,
    // the sand floor is pale, so this chapter leans harder on the orb and a bluer sky light
    hemi: [0xa8d6f0, 0xc7ddd6], orb: 0xffd29a, warm: 0xffc9a0,
    light: { hemi: 0.9, key: 0.5, orb: 4.4 },
  },
];
const LEVELS = [
  {
    roman: 'I',
    theme: THEMES[0],
    post: { x: 3, z: 3 }, armR: 1.45, start: '6,6', startK: 5, gateX: 1,
    pillars: [{ x: 3, z: 0, h: 2.7, top: 'dome' }, { x: 1, z: 5, h: 2.7, top: 'pyramid' }, { x: 3, z: 4, h: 1.2 }],
    walls: [{ x: 2, z: 1, len: 3, axis: 'z', h: 1.0 }, { x: 4, z: 2, len: 3, axis: 'z', h: 1.0 }],
    slider: null,
    towers: { backLeft: 'dome', backRight: 'pyramid', leftFront: 'cone' },
    backWindows: [4.5, 5.4], leftWindows: [1.3, 2.7, 4.1],
    intro: '她只能走在影子里。拖动光球，影子会跟着转',
    goal: '一边转动光球，一边走向那扇门',
    card: { eyebrow: 'Chapter I · Complete', title: '门开了', line: '她踩着影子穿过庭院，<br>走进了那扇门。' },
  },
  {
    roman: 'II',
    theme: THEMES[1],
    post: { x: 3, z: 3 }, armR: 1.45, start: '0,6', startK: 6, gateX: 2,
    pillars: [{ x: 0, z: 3, h: 2.7, top: 'dome' }, { x: 1, z: 4, h: 1.2 }],
    walls: [{ x: 1, z: 2, len: 3, axis: 'x', h: 1.0 }],
    slider: { x: 4, z: 3, axis: 'z', n: 4, h: 1.8, start: 1 },
    towers: { backLeft: 'cone', backRight: 'dome', leftFront: 'pyramid' },
    backWindows: [3.6, 4.5, 5.4], leftWindows: [1.2, 4.8],
    intro: '右边那座塔可以推动。拖动它，影子会跟着移动',
    goal: '转光球、推小塔，替她铺出去门口的路',
    card: { eyebrow: 'Chapter II · Complete', title: '海风起', line: '光转了三次，塔推了三回，<br>她终于走到了门前。' },
  },
];

// ---------- the rules ----------
const key = (x, z) => x + ',' + z;
let L = null;                 // the current level
let OCC = [];                 // static occluder boxes
let BLOCKED = new Set();
let TILES = new Map();
let GATE = '', GATE_IN = '';

function loadRules(level) {
  L = level;
  OCC = [];
  level.pillars.forEach((p) => OCC.push({ lo: [p.x - 0.35, 0, p.z - 0.35], hi: [p.x + 0.35, p.h, p.z + 0.35] }));
  level.walls.forEach((w) => OCC.push(w.axis === 'x'
    ? { lo: [w.x - 0.5, 0, w.z - 0.18], hi: [w.x + w.len - 0.5, w.h, w.z + 0.18] }
    : { lo: [w.x - 0.18, 0, w.z - 0.5], hi: [w.x + 0.18, w.h, w.z + w.len - 0.5] }));
  BLOCKED = new Set([key(level.post.x, level.post.z)]);
  level.pillars.forEach((p) => BLOCKED.add(key(p.x, p.z)));
  level.walls.forEach((w) => { for (let i = 0; i < w.len; i++) BLOCKED.add(w.axis === 'x' ? key(w.x + i, w.z) : key(w.x, w.z + i)); });
  TILES = new Map();
  for (let x = 0; x < N; x++) {
    for (let z = 0; z < N; z++) {
      if (!BLOCKED.has(key(x, z))) TILES.set(key(x, z), { id: key(x, z), x, z });
    }
  }
  GATE = key(level.gateX, -1);
  GATE_IN = key(level.gateX, 0);
  TILES.set(GATE, { id: GATE, x: level.gateX, z: -1, gate: true });
}
function sliderXZ(pos) {
  const s = L.slider;
  return s.axis === 'x' ? [s.x + pos, s.z] : [s.x, s.z + pos];
}
function sliderCell(pos) {
  if (!L.slider) return null;
  const [x, z] = sliderXZ(Math.round(pos));
  return key(x, z);
}
function occludersAt(pos) {
  if (!L.slider) return OCC;
  const [x, z] = sliderXZ(pos);
  return OCC.concat([{ lo: [x - 0.35, 0, z - 0.35], hi: [x + 0.35, L.slider.h, z + 0.35] }]);
}
function lampAt(theta, out) {
  out[0] = L.post.x + L.armR * Math.cos(theta);
  out[1] = LAMP_Y;
  out[2] = L.post.z + L.armR * Math.sin(theta);
  return out;
}
function segHitsBox(p, q, lo, hi) {
  let t0 = 0, t1 = 1;
  for (let a = 0; a < 3; a++) {
    const d = q[a] - p[a];
    if (Math.abs(d) < 1e-9) {
      if (p[a] < lo[a] || p[a] > hi[a]) return false;
      continue;
    }
    let ta = (lo[a] - p[a]) / d, tb = (hi[a] - p[a]) / d;
    if (ta > tb) { const s = ta; ta = tb; tb = s; }
    if (ta > t0) t0 = ta;
    if (tb < t1) t1 = tb;
    if (t0 > t1) return false;
  }
  return true;
}
// a tile is shadow when at least 3 of its 5 sample points cannot see the orb
const SAMPLES = [[0, 0], [0.25, 0.25], [-0.25, 0.25], [0.25, -0.25], [-0.25, -0.25]];
const _p = [0, 0.05, 0], _q = [0, 0, 0];
function inShadow(tile, theta, pos) {
  if (tile.gate) return true;
  lampAt(theta, _q);
  const occ = occludersAt(pos);
  let dark = 0;
  for (const s of SAMPLES) {
    _p[0] = tile.x + s[0];
    _p[2] = tile.z + s[1];
    for (const o of occ) {
      if (segHitsBox(_p, _q, o.lo, o.hi)) { dark++; break; }
    }
  }
  return dark >= 3;
}
function shadeAt(theta, pos) {
  const out = new Set(), cell = sliderCell(pos);
  TILES.forEach((t) => { if (t.id !== cell && inShadow(t, theta, pos)) out.add(t.id); });
  return out;
}
function neighbours(id) {
  const t = TILES.get(id), out = [];
  [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dz]) => {
    const n = TILES.get(key(t.x + dx, t.z + dz));
    if (n) out.push(n.id);
  });
  return out;
}
function findPath(from, to, shade) {
  if (from === to) return [from];
  const prev = new Map([[from, null]]);
  const queue = [from];
  while (queue.length) {
    const cur = queue.shift();
    for (const n of neighbours(cur)) {
      if (!shade.has(n) || prev.has(n)) continue;
      prev.set(n, cur);
      if (n === to) {
        const path = [to];
        for (let p = cur; p; p = prev.get(p)) path.unshift(p);
        return path;
      }
      queue.push(n);
    }
  }
  return null;
}

// ---------- renderer ----------
const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (err) {
  fail('这个浏览器没有开启 WebGL，无法显示庭院');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;
const canvas = renderer.domElement;
canvas.setAttribute('role', 'img');
canvas.setAttribute('aria-label', '漂浮的庭院。旅人只能走在影子里，拖动或点击光球改变影子，第二关还可以拖动一座小塔，点击影子里的石板让她走过去。键盘按 R 转动光球。');
stage.appendChild(canvas);

const ISO = new THREE.Vector3(1, 1, 1).normalize();
const SCREEN_R = new THREE.Vector3(1, 0, -1).normalize();
const SCREEN_U = new THREE.Vector3(-1, 2, -1).normalize();
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-5, 5, 5, -5, 0.1, 500);
camera.position.copy(ISO).multiplyScalar(150);
camera.lookAt(0, 0, 0);

// Flat, face-by-face shading like the first demo: sky light everywhere, a soft key light that
// separates top, left and right faces, and the warm orb on top. (r160 uses physical light
// units, so these read about pi times the old values.)
const hemi = new THREE.HemisphereLight(0xffffff, 0xffffff, 1.1);
scene.add(hemi);
const keyLight = new THREE.DirectionalLight(0xffffff, 0.75);
keyLight.position.set(0.15, 0.85, 0.5);
scene.add(keyLight);
const warmLight = new THREE.DirectionalLight(0xffffff, 0.35);
warmLight.position.set(1, 0.1, -0.2);
scene.add(warmLight);

// ---------- shared geometry ----------
const BOX = new THREE.BoxGeometry(1, 1, 1);
const flatNormals = (g) => { const n = g.toNonIndexed(); n.computeVertexNormals(); return n; };
const PYR_UP = (() => { const g = new THREE.ConeGeometry(Math.SQRT1_2, 1, 4); g.rotateY(Math.PI / 4); return flatNormals(g); })();
const PYR_DOWN = (() => { const g = new THREE.ConeGeometry(Math.SQRT1_2, 1, 4); g.rotateY(Math.PI / 4); g.rotateX(Math.PI); return flatNormals(g); })();
const DOME = new THREE.SphereGeometry(1, 28, 14, 0, TAU, 0, Math.PI / 2);
const CONE = new THREE.ConeGeometry(1, 1, 32);
const ROD = new THREE.CylinderGeometry(1, 1, 1, 8);
const BALL = new THREE.SphereGeometry(1, 14, 10);
function archGeo(w, h) {
  const r = w / 2, s = new THREE.Shape();
  s.moveTo(-r, 0);
  s.lineTo(-r, h - r);
  s.absarc(0, h - r, r, Math.PI, 0, true);
  s.lineTo(r, 0);
  s.closePath();
  return new THREE.ShapeGeometry(s, 12);
}
const ARCH_WINDOW = archGeo(0.24, 0.42);
const ARCH_FRAME = archGeo(0.74, 1.26);
const ARCH_DOOR = archGeo(0.56, 1.12);
const FLASH = new THREE.PlaneGeometry(0.92, 0.92);
FLASH.rotateX(-Math.PI / 2);
const SHARED_GEO = new Set([BOX, PYR_UP, PYR_DOWN, DOME, CONE, ROD, BALL, ARCH_WINDOW, ARCH_FRAME, ARCH_DOOR, FLASH]);

const glowTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d'), grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255, 236, 190, 0.9)');
  grd.addColorStop(1, 'rgba(255, 210, 160, 0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

const turnToward = (cur, target, k) => {
  let d = (target - cur) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return cur + d * Math.min(1, k);
};

// ---------- building a level ----------
let world = null;
let pickables = [];
let M = null;                 // materials for the current theme
let arm, orb, lampLight, sliderGroup, doorMat;
let doorFrom = new THREE.Color(), doorTo = new THREE.Color(0xffe2a0);

function mesh(geo, mat, parent, opt) {
  opt = opt || {};
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = opt.cast !== false;
  m.receiveShadow = opt.receive !== false;
  (parent || world).add(m);
  if (opt.pick !== false) pickables.push(m);
  return m;
}
function box(x, y, z, sx, sy, sz, mat, parent, opt) {
  const m = mesh(BOX, mat, parent, opt);
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  return m;
}
function pyramid(x, yBase, z, w, h, mat) {
  const m = mesh(PYR_UP, mat);
  m.scale.set(w, h, w);
  m.position.set(x, yBase + h / 2, z);
  return m;
}
function dome(x, y, z, r, mat) {
  const m = mesh(DOME, mat);
  m.scale.setScalar(r);
  m.position.set(x, y, z);
  return m;
}
function cone(x, yBase, z, r, h, mat) {
  const m = mesh(CONE, mat);
  m.scale.set(r, h, r);
  m.position.set(x, yBase + h / 2, z);
  return m;
}
function finial(x, y, z, s) {
  s = s || 1;
  const r = mesh(ROD, M.gold);
  r.scale.set(0.02 * s, 0.26 * s, 0.02 * s);
  r.position.set(x, y + 0.13 * s, z);
  const b = mesh(BALL, M.gold);
  b.scale.setScalar(0.055 * s);
  b.position.set(x, y + 0.28 * s, z);
}
function roof(kind, x, y, z, size) {
  if (kind === 'dome') { dome(x, y, z, size * 0.42, M.roofB); finial(x, y + size * 0.4, z, size * 1.1); }
  else if (kind === 'pyramid') { pyramid(x, y, z, size * 1.04, size * 0.72, M.roofB); finial(x, y + size * 0.7, z); }
  else { cone(x, y, z, size * 0.56, size * 0.8, M.roofA); finial(x, y + size * 0.78, z); }
}
// a flat arch on the visible +z or +x face of a block centred at (x, z) with the given half width
function decal(x, y, z, face, half, geo, mat) {
  const m = new THREE.Mesh(geo || ARCH_WINDOW, mat || M.window);
  if (face === 'x') { m.position.set(x + half + 0.003, y, z); m.rotation.y = Math.PI / 2; }
  else m.position.set(x, y, z + half + 0.003);
  world.add(m);
  return m;
}

function makeMaterials(t) {
  const flat = (c) => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
  return {
    floor: t.floor.map((c) => lam(c)),
    plinth: lam(t.plinth), plinthDeep: lam(t.plinthDeep),
    stone: lam(t.stone), stoneWarm: lam(t.stoneWarm),
    roofA: lam(t.roofA), roofB: lam(t.roofB), move: lam(t.move),
    gold: lam(0xf2c76b, { emissive: 0x4a3200 }),
    groove: new THREE.MeshBasicMaterial({ color: t.groove, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }),
    window: flat(t.window), frame: flat(t.frame), door: flat(t.door),
    orb: new THREE.MeshBasicMaterial({ color: 0xfff3d1 }),
    grab: new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }),
  };
}

function teardown() {
  if (!world) return;
  if (lampLight) lampLight.dispose();
  const themed = new Set(Object.values(M).flat());
  world.traverse((o) => {
    if (o.geometry && !SHARED_GEO.has(o.geometry)) o.geometry.dispose();
    if (o.material && !themed.has(o.material)) o.material.dispose();
  });
  themed.forEach((m) => m.dispose());
  flashes.length = 0;
  scene.remove(world);
  world = null;
}

// ---------- sound ----------
const Sound = {
  ctx: null,
  on: true,
  si: 0,
  ensure() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const c = this.ctx;
    this.master = c.createGain();
    this.master.gain.value = this.on ? 0.85 : 0;
    this.master.connect(c.destination);
    this.dry = c.createGain();
    this.dry.gain.value = 0.75;
    this.dry.connect(this.master);
    const verb = c.createConvolver();
    verb.buffer = this.impulse(3.2);
    this.wet = c.createGain();
    this.wet.gain.value = 0.5;
    this.wet.connect(verb);
    verb.connect(this.master);
    this.pad();
  },
  impulse(sec) {
    const c = this.ctx, n = Math.floor(c.sampleRate * sec), buf = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.6);
    }
    return buf;
  },
  send(node) { node.connect(this.dry); node.connect(this.wet); },
  bell(freq, delay, vol, decay) {
    const c = this.ctx;
    if (!c) return;
    const t = c.currentTime + (delay || 0);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    [[1, 1], [2, 0.22], [3.01, 0.07]].forEach(([m, a]) => {
      const o = c.createOscillator(), og = c.createGain();
      o.frequency.value = freq * m;
      og.gain.value = a;
      o.connect(og);
      og.connect(g);
      o.start(t);
      o.stop(t + decay + 0.1);
    });
    this.send(g);
  },
  step() {
    const seq = [587.33, 659.25, 739.99, 880, 987.77, 880, 739.99, 659.25];
    this.si = (this.si + 1) % seq.length;
    this.bell(seq[this.si], 0, 0.045, 0.55);
  },
  tick() {
    const c = this.ctx;
    if (!c) return;
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(1500, t);
    o.frequency.exponentialRampToValueAtTime(700, t + 0.04);
    g.gain.setValueAtTime(0.03, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g);
    this.send(g);
    o.start(t);
    o.stop(t + 0.06);
  },
  thud() {
    const c = this.ctx;
    if (!c) return;
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(62, t + 0.3);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.2, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g);
    this.send(g);
    o.start(t);
    o.stop(t + 0.55);
  },
  rest() { this.bell(880, 0, 0.06, 2.2); this.bell(1318.5, 0.12, 0.045, 2.4); },
  grind() { this.thud(); this.bell(440, 0.05, 0.04, 1.2); },
  blocked() { this.thud(); this.bell(207.65, 0.02, 0.05, 0.6); },
  nope() { this.bell(220, 0, 0.04, 0.35); },
  win() { [293.66, 369.99, 440, 587.33, 739.99, 880, 1174.66].forEach((f, i) => this.bell(f, i * 0.14, 0.09, 2.8)); },
  pad() {
    const c = this.ctx, t = c.currentTime;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 5);
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 650;
    lp.Q.value = 0.4;
    const lfo = c.createOscillator(), depth = c.createGain();
    lfo.frequency.value = 0.06;
    depth.gain.value = 260;
    lfo.connect(depth);
    depth.connect(lp.frequency);
    lfo.start(t);
    [146.83, 220, 329.63, 369.99].forEach((f, i) => {
      [-4, 4].forEach((cents) => {
        const o = c.createOscillator(), og = c.createGain();
        o.type = 'triangle';
        o.frequency.value = f;
        o.detune.value = cents + i;
        og.gain.value = 0.18;
        o.connect(og);
        og.connect(lp);
        o.start(t);
      });
    });
    lp.connect(g);
    this.send(g);
  },
  toggle(on) {
    this.on = on;
    if (this.master) this.master.gain.setTargetAtTime(on ? 0.85 : 0, this.ctx.currentTime, 0.08);
  },
};

const state = { level: 0, theta: 0, k: 0, pos: 0, s: 0, won: false, moved: false, rotated: false, slid: false, winT: -1, shake: 0, shiver: 0 };
let shade = new Set();
const walker = { tile: '', step: null, path: [], pending: null, exit: null };
let lampAnim = null, slideAnim = null;
const mod8 = (k) => ((k % 8) + 8) % 8;
const busy = () => state.won || !!walker.step || !!lampAnim || !!slideAnim;

}
function setLampTheta(theta) {

// how far the orb can travel toward `to` before its light would reach her
function lampReach(from, to) {
  const tile = TILES.get(walker.tile);
  const dir = Math.sign(to - from);
  let a = from;
  while (Math.abs(to - a) > 1e-9) {
    const next = Math.abs(to - a) <= SWEEP ? to : a + dir * SWEEP;
    if (!inShadow(tile, next, state.pos)) return { at: a, blocked: 'light' };
    a = next;
  }
  return { at: a, blocked: false };
}
// how far the tower can slide toward `to` before it would hit her or let the light reach her
function slideReach(from, to) {
  const tile = TILES.get(walker.tile), s = L.slider;
  const onTrack = s.axis === 'x' ? tile.z === s.z : tile.x === s.x;
  const her = onTrack ? (s.axis === 'x' ? tile.x - s.x : tile.z - s.z) : null;
  const dir = Math.sign(to - from);
  let p = from;
  while (Math.abs(to - p) > 1e-9) {
    const next = Math.abs(to - p) <= SLIDE_STEP ? to : p + dir * SLIDE_STEP;
    if (her !== null && Math.abs(next - her) < 0.999) return { at: p, blocked: 'body' };
    if (!inShadow(tile, state.theta, next)) return { at: p, blocked: 'light' };
    p = next;
  }
  return { at: p, blocked: false };
}
function settle() {
  shade = shadeAt(state.theta, state.pos);
  updateHint();
}
function settleLamp(theta) {
  const before = state.k;
  state.k = mod8(Math.round(theta / STEP));
  setLampTheta(theta);
  if (state.k !== before) { state.rotated = true; Sound.rest(); }
  settle();
}
function settleSlider(pos) {
  const before = state.s;
  state.s = Math.round(pos);
  setSliderPos(state.s);
  if (state.s !== before) { state.slid = true; Sound.grind(); }
  settle();
}
function animateLamp(to) {
  lampAnim = { from: state.theta, to, t: 0, dur: 0.32 + 0.3 * Math.min(2, Math.abs(to - state.theta) / STEP) };
}
function animateSlider(to) {
  slideAnim = { from: state.pos, to, t: 0, dur: 0.25 + 0.25 * Math.min(2, Math.abs(to - state.pos)) };
}
function rotateBy(n) {
  if (busy()) return;
  const target = (Math.round(state.theta / STEP) + n) * STEP;
  const r = lampReach(state.theta, target);
  if (r.blocked) { onBlocked('light'); return; }
  animateLamp(target);
}
function onBlocked(why, what) {
  state.shake = 1;
  state.shiver = 1;
  Sound.blocked();
  if (why === 'body') flashHint('她挡在路上，塔推不过去', true);
  else flashHint(what === 'slider' ? '再推下去，光就会照到她' : '再转下去，光就会照到她', true);
}

// ---------- hints ----------
let hintTimer = 0, flashTimer = 0, flashing = false;
function showHint(text, warm) {
  if (hintEl.dataset.text === text && hintEl.classList.contains('warm') === !!warm) return;
  hintEl.dataset.text = text;
  hintEl.classList.remove('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => {
    hintEl.textContent = text;
    hintEl.classList.toggle('warm', !!warm);
    if (text) hintEl.classList.add('show');
  }, 220);
}
function flashHint(text, warm) {
  flashing = true;
  showHint(text, warm);
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { flashing = false; updateHint(); }, 2400);
}
function updateHint() {
  if (flashing) return;
  if (state.won) return showHint('');
  if (!state.rotated && !state.moved && !state.slid) return showHint(L.intro);
  if (findPath(walker.tile, GATE_IN, shade)) return showHint('门就在前面');
  if ((state.rotated || state.slid) && !state.moved) return showHint('点影子里的石板，带她过去');
  if (L.slider && !state.slid) return showHint('别忘了那座可以推动的塔');
  return showHint(L.goal);
}

// ---------- walking ----------
function walkTo(id) {
  if (state.won || lampAnim || slideAnim || (press && press.dragging)) return;
  if (!TILES.has(id)) return;
  if (!shade.has(id)) {
    flashTile(id);
    Sound.nope();
    flashHint('那里有光，她过不去', true);
    return;
  }
  if (walker.step) { walker.pending = id; return; }
  if (id === walker.tile) return;
  const path = findPath(walker.tile, id, shade);
  if (!path) {
    Sound.nope();
    flashHint(L.slider ? '影子没有连到那里，转一转光球或推一推塔' : '影子没有连到那里，转一转光球', true);
    return;
  }
  walker.path = path.slice(1);
  nextStep();
}
function nextStep() {
  if (walker.pending) {
    const p = findPath(walker.tile, walker.pending, shade);
    walker.pending = null;
    walker.path = p ? p.slice(1) : [];
  }
  if (!walker.path.length) { updateHint(); return; }
  const to = walker.path.shift();
  const a = tileWorld(walker.tile, new THREE.Vector3()), b = tileWorld(to, new THREE.Vector3());
  facing = Math.atan2(b.x - a.x, b.z - a.z);
  walker.step = { to, a, b, t: 0 };
  state.moved = true;
}
function updateWalker(dt) {
  const s = walker.step;
  char.rotation.y = turnToward(char.rotation.y, facing, dt * 12);
  if (s) {
    s.t = Math.min(1, s.t + dt / STEP_TIME);
    char.position.lerpVectors(s.a, s.b, s.t);
    body.position.y = Math.sin(s.t * Math.PI) * 0.03;
    if (s.t >= 1) {
      walker.tile = s.to;
      walker.step = null;
      Sound.step();
      if (s.to === GATE) { win(); return; }
      nextStep();
    }
    return;
  }
  if (walker.exit) {
    const e = walker.exit;
    e.t = Math.min(1, e.t + dt / 1.4);
    char.position.set(L.gateX, 0, -1 - 0.5 * e.t);
    robeMat.opacity = scarfMat.opacity = 1 - e.t;
    return;
  }
  body.position.y = 0;
  body.scale.y = 1 + Math.sin(clock.t * 2.2) * 0.012;
  body.rotation.z = state.shiver > 0 ? Math.sin(clock.t * 50) * 0.08 * state.shiver : 0;
}

// ---------- win / levels ----------
const card = document.getElementById('card');
const nextBtn = document.getElementById('btn-next');
function saveLevel(i) { try { localStorage.setItem('shadow-path-level', String(i)); } catch (e) { /* storage unavailable */ } }
function savedLevel() {
  try {
    const v = parseInt(localStorage.getItem('shadow-path-level'), 10);
    return Number.isInteger(v) && v >= 0 && v < LEVELS.length ? v : 0;
  } catch (e) { return 0; }
}
function win() {
  state.won = true;
  state.winT = 0;
  showHint('');
  Sound.win();
  facing = Math.PI;
  robeMat.transparent = scarfMat.transparent = true;
  walker.exit = { t: 0 };
  const last = state.level === LEVELS.length - 1;
  if (!last) saveLevel(state.level + 1);
  document.getElementById('card-eyebrow').textContent = L.card.eyebrow;
  document.getElementById('card-title').textContent = L.card.title;
  document.getElementById('card-line').innerHTML = L.card.line;
  nextBtn.textContent = last ? '从第一关开始' : '下一关';
  setTimeout(() => {
    if (!state.won) return;
    card.hidden = false;
    requestAnimationFrame(() => card.classList.add('show'));
    nextBtn.focus({ preventScroll: true });
  }, 1900);
}
function resetLevel(data) {
  state.won = false;
  state.winT = -1;
  state.moved = state.rotated = state.slid = false;
  state.shake = state.shiver = 0;
  card.classList.remove('show');
  card.hidden = true;
  lampAnim = slideAnim = null;
  walker.step = null;
  walker.path = [];
  walker.pending = null;
  walker.exit = null;
  robeMat.transparent = scarfMat.transparent = false;
  robeMat.opacity = scarfMat.opacity = 1;
  doorMat.color.copy(doorFrom);
  body.rotation.z = 0;
  let k = L.startK, s = L.slider ? L.slider.start : 0, tile = L.start;
  if (data && Number.isInteger(data.k) && TILES.has(data.tile) && data.tile !== GATE) {
    const ds = L.slider && Number.isInteger(data.s) ? data.s : s;
    if (shadeAt(data.k * STEP, ds).has(data.tile)) { k = data.k; s = ds; tile = data.tile; }
  }
  walker.tile = tile;
  state.k = k;
  state.s = s;
  setLampTheta(k * STEP);
  state.pos = s;
  if (L.slider) setSliderPos(s);
  shade = shadeAt(state.theta, state.pos);
  state.rotated = state.moved = tile !== L.start;
  tileWorld(tile, char.position);
  facing = char.rotation.y = tile === '0,6' ? -Math.PI / 2 : -Math.PI * 3 / 4;
  flashing = false;
  updateHint();
}
function enterLevel(i, data) {
  state.level = i;
  saveLevel(i);
  buildLevel(LEVELS[i]);
  resetLevel(data);
}
function changeLevel(i) {
  stage.classList.add('fading');
  card.classList.remove('show');
  setTimeout(() => {
    enterLevel(i);
    stage.classList.remove('fading');
  }, 450);
}

// ---------- input ----------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const lampPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -LAMP_Y);
const slidePlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.9);
const tmp = new THREE.Vector3();
function aim(cx, cy) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
}
function hitAt(cx, cy) {
  aim(cx, cy);
  const hits = raycaster.intersectObjects(pickables, false);
  for (const h of hits) {
    const ud = h.object.userData;
    if (ud.lamp) return { lamp: true };
    if (ud.slider) return { slider: true };
    if (ud.tile) return { tile: ud.tile };
    return null;
  }
  return null;
}
function angleAt(cx, cy) {
  aim(cx, cy);
  if (!raycaster.ray.intersectPlane(lampPlane, tmp)) return null;
  return Math.atan2(tmp.z - L.post.z, tmp.x - L.post.x);
}
function trackAt(cx, cy) {
  aim(cx, cy);
  if (!raycaster.ray.intersectPlane(slidePlane, tmp)) return null;
  return L.slider.axis === 'x' ? tmp.x - L.slider.x : tmp.z - L.slider.z;
}

let press = null;
canvas.addEventListener('pointerdown', (e) => {
  Sound.ensure();
  if (state.won || press) return;
  const hit = hitAt(e.clientX, e.clientY);
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, hit, moved: 0, dragging: false };
  if (hit && !busy()) {
    if (hit.lamp) {
      press.kind = 'lamp';
      press.last = angleAt(e.clientX, e.clientY);
      press.base = state.theta;
      press.acc = 0;
      press.start = state.theta;
    } else if (hit.slider) {
      const at = trackAt(e.clientX, e.clientY);
      press.kind = 'slider';
      press.last = at;
      press.grab = at === null ? 0 : at - state.pos;
      press.start = state.pos;
    }
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not needed for mouse */ }
});
canvas.addEventListener('pointermove', (e) => {
  if (!press) {
    if (e.pointerType === 'mouse') {
      const h = hitAt(e.clientX, e.clientY);
      canvas.style.cursor = !h ? 'default' : (h.lamp || h.slider) ? 'grab' : shade.has(h.tile) ? 'pointer' : 'not-allowed';
    }
    return;
  }
  if (e.pointerId !== press.id) return;
  press.moved = Math.max(press.moved, Math.hypot(e.clientX - press.x, e.clientY - press.y));
  if (!press.dragging && press.kind && press.moved > 5 && press.last !== null) {
    press.dragging = true;
    canvas.style.cursor = 'grabbing';
  }
  if (!press.dragging) return;
  if (press.kind === 'lamp') {
    const a = angleAt(e.clientX, e.clientY);
    if (a === null) return;
    let d = a - press.last;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    press.acc += d;
    press.last = a;
    const r = lampReach(state.theta, press.base + press.acc);
    if (r.at !== state.theta) {
      if (Math.floor(r.at / (STEP / 4)) !== Math.floor(state.theta / (STEP / 4))) Sound.tick();
      setLampTheta(r.at);
    }
    if (r.blocked && !press.warned) { press.warned = true; onBlocked(r.blocked, 'lamp'); }
    if (!r.blocked) press.warned = false;
  } else {
    const at = trackAt(e.clientX, e.clientY);
    if (at === null) return;
    const want = Math.max(0, Math.min(L.slider.n - 1, at - press.grab));
    const r = slideReach(state.pos, want);
    if (r.at !== state.pos) {
      if (Math.floor(r.at * 4) !== Math.floor(state.pos * 4)) Sound.tick();
      setSliderPos(r.at);
    }
    if (r.blocked && !press.warned) { press.warned = true; onBlocked(r.blocked, 'slider'); }
    if (!r.blocked) press.warned = false;
  }
});
function endPress(e) {
  if (!press || e.pointerId !== press.id) return;
  const p = press;
  press = null;
  canvas.style.cursor = 'default';
  if (p.dragging && p.kind === 'lamp') {
    const near = Math.round(state.theta / STEP) * STEP;
    const other = state.theta > near ? near + STEP : near - STEP;
    const target = [near, other, Math.round(p.start / STEP) * STEP].find((c) => !lampReach(state.theta, c).blocked);
    animateLamp(target === undefined ? p.start : target);
    return;
  }
  if (p.dragging && p.kind === 'slider') {
    const near = Math.round(state.pos);
    const other = state.pos > near ? near + 1 : near - 1;
    const target = [near, other, Math.round(p.start)]
      .filter((c) => c >= 0 && c < L.slider.n)
      .find((c) => !slideReach(state.pos, c).blocked);
    animateSlider(target === undefined ? p.start : target);
    return;
  }
  if (e.type === 'pointercancel' || p.moved > 12 || !p.hit) return;
  if (p.hit.lamp) rotateBy(1);
  else if (p.hit.slider) flashHint('按住小塔，沿着地上的凹槽拖动它');
  else if (p.hit.tile) walkTo(p.hit.tile);
}
canvas.addEventListener('pointerup', endPress);
canvas.addEventListener('pointercancel', endPress);

window.addEventListener('keydown', (e) => {
  if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey) {
    Sound.ensure();
    rotateBy(e.shiftKey ? -1 : 1);
  }
});
const soundBtn = document.getElementById('btn-sound');
soundBtn.addEventListener('click', () => {
  const on = soundBtn.getAttribute('aria-pressed') !== 'true';
  soundBtn.setAttribute('aria-pressed', String(on));
  soundBtn.setAttribute('aria-label', on ? '声音' : '已静音');
  Sound.toggle(on);
  Sound.ensure();
});
document.getElementById('btn-reset').addEventListener('click', () => { Sound.ensure(); resetLevel(); });
document.getElementById('btn-again').addEventListener('click', () => { Sound.ensure(); resetLevel(); });
nextBtn.addEventListener('click', () => {
  Sound.ensure();
  changeLevel(state.level === LEVELS.length - 1 ? 0 : state.level + 1);
});

// ---------- framing ----------
const P = (x, y, z) => new THREE.Vector3(x, y, z);
const FIT_CORE = [P(-1, 4.0, -1), P(6.5, 0, -0.5), P(-0.5, 0, 6.5), P(6.5, -0.9, 6.5), P(3, 3.0, 0)];
const FIT_WIDE = [P(6.5, 3.6, -1.5), P(-1.5, 3.6, 6.5)];
function fit() {
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setSize(W, H);
  const pts = W > H ? FIT_CORE.concat(FIT_WIDE) : FIT_CORE;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  pts.forEach((p) => {
    const x = p.dot(SCREEN_R), y = p.dot(SCREEN_U);
    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    minY = Math.min(minY, y); maxY = Math.max(maxY, y);
  });
  const padTop = Math.min(110, H * 0.13), padBottom = Math.min(90, H * 0.11), padSide = W > H ? Math.max(24, W * 0.05) : 10;
  const availW = W - padSide * 2, availH = H - padTop - padBottom;
  const ppu = Math.min(availW / (maxX - minX), availH / (maxY - minY));
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  camera.left = cx - W / 2 / ppu;
  camera.right = cx + W / 2 / ppu;
  camera.top = cy + (padTop + availH / 2) / ppu;
  camera.bottom = camera.top - H / ppu;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', fit);

// ---------- loop ----------
const clock = { last: performance.now(), t: 0 };
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - clock.last) / 1000));
  clock.last = now;
  tickWorld(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
function tickWorld(dt) {
  clock.t += dt;
  if (lampAnim) {
    const a = lampAnim;
    a.t = Math.min(1, a.t + dt / a.dur);
    const k = 1 - Math.pow(1 - a.t, 3);
    setLampTheta(a.from + (a.to - a.from) * k);
    if (a.t >= 1) { lampAnim = null; settleLamp(a.to); }
  }
  if (slideAnim) {
    const a = slideAnim;
    a.t = Math.min(1, a.t + dt / a.dur);
    const k = 1 - Math.pow(1 - a.t, 3);
    setSliderPos(a.from + (a.to - a.from) * k);
    if (a.t >= 1) { slideAnim = null; settleSlider(a.to); }
  }
  updateWalker(dt);
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i];
    f.t = Math.min(1, f.t + dt / 0.6);
    f.m.material.opacity = 0.55 * (1 - f.t);
    if (f.t >= 1) { f.m.parent && f.m.parent.remove(f.m); f.m.material.dispose(); flashes.splice(i, 1); }
  }
  state.shake = Math.max(0, state.shake - dt * 2.5);
  state.shiver = Math.max(0, state.shiver - dt * 1.8);
  orb.position.y = Math.sin(clock.t * 40) * 0.04 * state.shake + Math.sin(clock.t * 1.4) * 0.012;
  if (state.winT >= 0) {
    state.winT = Math.min(1, state.winT + dt / 1.6);
    const k = state.winT * state.winT * (3 - 2 * state.winT);
    doorMat.color.copy(doorFrom).lerp(doorTo, k);
  }
}

// ---------- boot ----------
function start(data) {
  const lv = data && Number.isInteger(data.level) && data.level >= 0 && data.level < LEVELS.length ? data.level : savedLevel();
  enterLevel(lv, data && data.level === lv ? data : null);
  fit();
  requestAnimationFrame((t) => { clock.last = t; loop(t); });
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ level: state.level, k: state.k, s: state.s, tile: walker.tile }));
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});

</script>
</body>
