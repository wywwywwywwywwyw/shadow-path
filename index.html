<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>影径</title>
<meta name="description" content="一个关于灯与影的等距小游戏：皮影小人只能走在影子里，转动灯笼，让影子替她铺出一条通往月门的路。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap">
<style>
  :root {
    /* Layout: full-bleed night sky with the courtyard as the only subject; HUD in the corners, end card as a centred veil */
    --night-1: #0c112e;
    --night-2: #1a1c44;
    --night-3: #2e2652;
    --mist-0: rgba(46, 38, 82, 0);
    --moon: #f4ecd6;
    --moon-halo: rgba(244, 236, 214, 0.14);
    --ink: #efe6d2;
    --ink-soft: rgba(239, 230, 210, 0.62);
    --ember: #f2a65a;
    --glass: rgba(22, 24, 58, 0.5);
    --glass-strong: rgba(40, 42, 88, 0.8);
    --line: rgba(239, 230, 210, 0.22);
    --veil: rgba(12, 17, 46, 0.78);
    --font-brush: "Ma Shan Zheng", "STKaiti", "KaiTi", serif;
    --font-display: "ZCOOL XiaoWei", "Songti SC", "STSong", serif;
    --font-latin: "Italiana", "Didot", "Bodoni 72", Georgia, serif;
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--night-2);
    background-image: linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 55%, var(--night-3) 100%);
    color: var(--ink);
    font-family: var(--font-display);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .moon {
    position: fixed; z-index: 0; pointer-events: none;
    width: 20vmin; height: 20vmin; right: 11%; top: 10%;
    border-radius: 50%;
    background: radial-gradient(circle at 44% 42%, var(--moon) 0 57%, transparent 60%);
    box-shadow: 0 0 80px 24px var(--moon-halo);
  }

  #stage { position: fixed; inset: 0; z-index: 1; }
  #stage canvas { display: block; touch-action: none; outline: none; }

  .mist {
    position: fixed; left: 0; right: 0; bottom: 0; height: 30vh; z-index: 2; pointer-events: none;
    background: linear-gradient(to bottom, var(--mist-0) 0%, var(--night-3) 88%);
  }

  .hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .title h1 {
    margin: 0;
    font: 400 clamp(34px, 4.2vw, 44px)/1 var(--font-brush);
    letter-spacing: 0.12em;
    color: var(--ink);
  }
  .title p {
    margin: 8px 0 0;
    font: 400 12px/1.4 var(--font-latin);
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .actions { display: flex; gap: 10px; }
  .icon-btn {
    width: 42px; height: 42px; padding: 0;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--glass);
    color: var(--ink);
    cursor: pointer;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: background-color 0.2s, transform 0.2s;
  }
  .icon-btn:hover { background: var(--glass-strong); transform: translateY(-1px); }
  .icon-btn:focus-visible, .text-btn:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn .off { display: none; }
  .icon-btn[aria-pressed="false"] .on { display: none; }
  .icon-btn[aria-pressed="false"] .off { display: block; }

  .hint {
    position: fixed; left: 0; right: 0; z-index: 3; margin: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
    font: 400 16px/1.5 var(--font-display);
    letter-spacing: 0.2em;
    color: var(--ink);
    text-shadow: 0 1px 12px rgba(12, 17, 46, 0.9);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.45s ease, transform 0.45s ease;
    pointer-events: none;
  }
  .hint.show { opacity: 0.94; transform: none; }
  .hint.warm { color: var(--ember); }

  .card {
    position: fixed; inset: 0; z-index: 4;
    display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: radial-gradient(ellipse at 50% 46%, var(--veil) 0%, var(--veil) 30%, transparent 74%);
    opacity: 0;
    transition: opacity 1s ease;
  }
  .card.show { opacity: 1; }
  .card-inner { display: grid; justify-items: center; gap: 14px; text-align: center; max-width: 30ch; }
  .card .eyebrow {
    margin: 0;
    font: 400 12px/1.4 var(--font-latin);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .card h2 {
    margin: 0;
    font: 400 clamp(60px, 11vw, 84px)/1 var(--font-brush);
    letter-spacing: 0.16em;
    padding-left: 0.16em;
    color: var(--moon);
  }
  .card .line { margin: 0; font-size: 16px; line-height: 1.8; letter-spacing: 0.12em; color: var(--ink); }
  .text-btn {
    margin-top: 10px;
    font: 400 15px/1 var(--font-display);
    letter-spacing: 0.3em;
    padding: 13px 22px 13px 26px;
    border-radius: 999px;
    border: 1px solid var(--ink-soft);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s;
  }
  .text-btn:hover { background: var(--ink); color: var(--night-1); }

  @media (max-width: 480px) {
    .hint { font-size: 15px; letter-spacing: 0.12em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hint, .card { transition: none; }
  }
</style>
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>
<div class="moon" aria-hidden="true"></div>
<div id="stage"></div>
<div class="mist" aria-hidden="true"></div>

<header class="hud">
  <div class="title">
    <h1>影径</h1>
    <p>The Shadow Path · I</p>
  </div>
  <div class="actions">
    <button id="btn-sound" class="icon-btn" type="button" aria-pressed="true" aria-label="声音">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
    <button id="btn-reset" class="icon-btn" type="button" aria-label="重新开始">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg>
    </button>
  </div>
</header>

<p id="hint" class="hint" aria-live="polite"></p>

<section id="card" class="card" hidden aria-live="polite">
  <div class="card-inner">
    <p class="eyebrow">Chapter I · Complete</p>
    <h2>月下</h2>
    <p class="line">她跟着影子穿过庭院，<br>走进了月光里。</p>
    <button id="btn-again" class="text-btn" type="button">再走一次</button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  const hintEl = document.getElementById('hint');
  function fail(msg) {
    hintEl.textContent = msg;
    hintEl.classList.add('show');
  }
  drawStars();
  window.addEventListener('resize', drawStars);
  if (!window.THREE) return fail('3D 引擎没能加载，请检查网络后刷新页面');

  // ---------- level ----------
  const TAU = Math.PI * 2;
  const STEP = Math.PI / 4;             // the lantern rests every 45 degrees
  const SWEEP = Math.PI / 180;          // safety check resolution while it moves
  const N = 7;
  const POST = { x: 3, z: 3 };
  const ARM_R = 1.45;
  const LAMP_Y = 2.1;
  const START = '6,6';
  const START_K = 5;
  const GATE = '1,-1';
  const GATE_IN = '1,0';
  const STEP_TIME = 0.4;

  // Every occluder is an axis-aligned box. The same boxes cast the rendered
  // shadow and decide which tiles she may stand on, so what you see is the rule.
  const PILLARS = [
    { x: 3, z: 0, h: 2.7 },
    { x: 1, z: 5, h: 2.7 },
    { x: 3, z: 4, h: 1.2 },
  ];
  const WALLS = [                       // low screen walls running along z
    { x: 2, z0: 1, len: 3, h: 1.0 },
    { x: 4, z0: 2, len: 3, h: 1.0 },
  ];
  const OCCLUDERS = [];
  PILLARS.forEach((p) => OCCLUDERS.push({ lo: [p.x - 0.35, 0, p.z - 0.35], hi: [p.x + 0.35, p.h, p.z + 0.35] }));
  WALLS.forEach((w) => OCCLUDERS.push({ lo: [w.x - 0.18, 0, w.z0 - 0.5], hi: [w.x + 0.18, w.h, w.z0 + w.len - 0.5] }));

  const key = (x, z) => x + ',' + z;
  const BLOCKED = new Set([key(POST.x, POST.z)]);
  PILLARS.forEach((p) => BLOCKED.add(key(p.x, p.z)));
  WALLS.forEach((w) => { for (let i = 0; i < w.len; i++) BLOCKED.add(key(w.x, w.z0 + i)); });
  const TILES = new Map();
  for (let x = 0; x < N; x++) {
    for (let z = 0; z < N; z++) {
      if (!BLOCKED.has(key(x, z))) TILES.set(key(x, z), { id: key(x, z), x, z });
    }
  }
  TILES.set(GATE, { id: GATE, x: 1, z: -1, gate: true });

  function lampAt(theta, out) {
    out[0] = POST.x + ARM_R * Math.cos(theta);
    out[1] = LAMP_Y;
    out[2] = POST.z + ARM_R * Math.sin(theta);
    return out;
  }
  function segHitsBox(p, q, lo, hi) {
    let t0 = 0, t1 = 1;
    for (let a = 0; a < 3; a++) {
      const d = q[a] - p[a];
      if (Math.abs(d) < 1e-9) {
        if (p[a] < lo[a] || p[a] > hi[a]) return false;
        continue;
      }
      let ta = (lo[a] - p[a]) / d, tb = (hi[a] - p[a]) / d;
      if (ta > tb) { const s = ta; ta = tb; tb = s; }
      if (ta > t0) t0 = ta;
      if (tb < t1) t1 = tb;
      if (t0 > t1) return false;
    }
    return true;
  }
  // a tile is shadow when at least 3 of its 5 sample points cannot see the lantern
  const SAMPLES = [[0, 0], [0.25, 0.25], [-0.25, 0.25], [0.25, -0.25], [-0.25, -0.25]];
  const _p = [0, 0.05, 0], _q = [0, 0, 0];
  function inShadow(tile, theta) {
    if (tile.gate) return true;
    lampAt(theta, _q);
    let dark = 0;
    for (const s of SAMPLES) {
      _p[0] = tile.x + s[0];
      _p[2] = tile.z + s[1];
      for (const o of OCCLUDERS) {
        if (segHitsBox(_p, _q, o.lo, o.hi)) { dark++; break; }
      }
    }
    return dark >= 3;
  }
  function shadeAt(theta) {
    const out = new Set();
    TILES.forEach((t) => { if (inShadow(t, theta)) out.add(t.id); });
    return out;
  }
  function neighbours(id) {
    const t = TILES.get(id), out = [];
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dz]) => {
      const n = TILES.get(key(t.x + dx, t.z + dz));
      if (n) out.push(n.id);
    });
    return out;
  }
  function findPath(from, to, shade) {
    if (from === to) return [from];
    const prev = new Map([[from, null]]);
    const queue = [from];
    while (queue.length) {
      const cur = queue.shift();
      for (const n of neighbours(cur)) {
        if (!shade.has(n) || prev.has(n)) continue;
        prev.set(n, cur);
        if (n === to) {
          const path = [to];
          for (let p = cur; p; p = prev.get(p)) path.unshift(p);
          return path;
        }
        queue.push(n);
      }
    }
    return null;
  }

  // ---------- renderer ----------
  const stage = document.getElementById('stage');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch (err) {
    return fail('这个浏览器没有开启 WebGL，无法显示庭院');
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  const canvas = renderer.domElement;
  canvas.setAttribute('role', 'img');
  canvas.setAttribute('aria-label', '夜色中的庭院。皮影小人只能走在影子里，拖动或点击灯笼改变影子，点击发蓝的石板让她走过去。键盘按 R 转动灯笼。');
  stage.appendChild(canvas);

  const ISO = new THREE.Vector3(1, 1, 1).normalize();
  const SCREEN_R = new THREE.Vector3(1, 0, -1).normalize();
  const SCREEN_U = new THREE.Vector3(-1, 2, -1).normalize();
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-5, 5, 5, -5, 0.1, 500);
  camera.position.copy(ISO).multiplyScalar(150);
  camera.lookAt(0, 0, 0);

  scene.add(new THREE.HemisphereLight(0x6c7cd0, 0x1a1530, 0.55));
  const moonLight = new THREE.DirectionalLight(0xa9b8ff, 0.3);
  moonLight.position.set(-0.4, 1, 0.55);
  scene.add(moonLight);

  // ---------- materials ----------
  const phong = (c, o) => new THREE.MeshPhongMaterial(Object.assign({ color: c, specular: 0x000000, shininess: 4 }, o || {}));
  const MAT = {
    floor: [phong(0xb4aca4), phong(0xaba39c), phong(0xbbb3aa)],
    plinth: phong(0x3a3556),
    plinthDeep: phong(0x2b2747),
    plaster: phong(0xdcd3c3),
    cap: phong(0x3b3d54),
    stone: phong(0x9f99ab),
    stoneDark: phong(0x6c6680),
    lacquer: phong(0x93302a),
    wood: phong(0x3a2a24),
    gold: phong(0xe0aa52, { emissive: 0x3a2200 }),
    lantern: phong(0xd8402d, { emissive: 0xc8401f }),
  };

  // ---------- builders ----------
  const BOX = new THREE.BoxGeometry(1, 1, 1);
  const pickables = [];
  function mesh(geo, mat, parent, opt) {
    opt = opt || {};
    const m = new THREE.Mesh(geo, mat);
    m.castShadow = opt.cast !== false;
    m.receiveShadow = opt.receive !== false;
    (parent || scene).add(m);
    if (opt.pick !== false) pickables.push(m);
    return m;
  }
  function box(x, y, z, sx, sy, sz, mat, parent, opt) {
    const m = mesh(BOX, mat, parent, opt);
    m.position.set(x, y, z);
    m.scale.set(sx, sy, sz);
    return m;
  }
  const flatNormals = (g) => { const n = g.toNonIndexed(); n.computeVertexNormals(); return n; };
  const PYR_UP = (() => { const g = new THREE.ConeGeometry(Math.SQRT1_2, 1, 4); g.rotateY(Math.PI / 4); return flatNormals(g); })();
  const PYR_DOWN = (() => { const g = new THREE.ConeGeometry(Math.SQRT1_2, 1, 4); g.rotateY(Math.PI / 4); g.rotateX(Math.PI); return flatNormals(g); })();
  const CYL = (r, h, seg) => new THREE.CylinderGeometry(r, r, h, seg || 20);
  function canvasTexture(w, h, draw) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    draw(c.getContext('2d'), w, h);
    return new THREE.CanvasTexture(c);
  }
  const radial = (inner, outer) => canvasTexture(128, 128, (g) => {
    const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grd.addColorStop(0, inner);
    grd.addColorStop(1, outer);
    g.fillStyle = grd;
    g.fillRect(0, 0, 128, 128);
  });

  // ---------- courtyard ----------
  for (let x = 0; x < N; x++) {
    for (let z = 0; z < N; z++) {
      const slab = box(x, -0.12, z, 0.95, 0.24, 0.95, MAT.floor[(x * 7 + z * 3) % 3]);
      if (TILES.has(key(x, z))) slab.userData.tile = key(x, z);
    }
  }
  box(1, -0.12, -1, 0.95, 0.24, 1, MAT.floor[0]).userData.tile = GATE;
  box(2.5, -0.55, 2.5, 8, 0.62, 8, MAT.plinth, scene, { cast: false });
  box(2.5, -1.1, 2.5, 7, 0.5, 7, MAT.plinthDeep, scene, { cast: false, pick: false });
  box(2.5, -1.55, 2.5, 5.6, 0.4, 5.6, MAT.plinthDeep, scene, { cast: false, pick: false });
  const keel = mesh(PYR_DOWN, MAT.plinthDeep, scene, { cast: false, pick: false });
  keel.scale.set(4.6, 2.6, 4.6);
  keel.position.set(2.5, -1.75 - 1.3, 2.5);

  // back wall with the moon gate cut through it
  const WALL_H = 2.3;
  const backShape = new THREE.Shape();
  {
    const cx = 1, cy = 0.62, r = 0.85;
    const a = Math.asin(cy / r), half = Math.sqrt(r * r - cy * cy);
    backShape.moveTo(-1.5, 0);
    backShape.lineTo(cx - half, 0);
    backShape.absarc(cx, cy, r, Math.PI + a, -a, true);
    backShape.lineTo(6.5, 0);
    backShape.lineTo(6.5, WALL_H);
    backShape.lineTo(-1.5, WALL_H);
    backShape.closePath();
  }
  const backWall = mesh(new THREE.ExtrudeGeometry(backShape, { depth: 1, bevelEnabled: false, curveSegments: 48 }), MAT.plaster);
  backWall.position.z = -1.5;
  box(2.5, WALL_H + 0.07, -1, 8.2, 0.14, 1.24, MAT.cap);
  box(2.5, WALL_H + 0.19, -1, 8.2, 0.1, 0.34, MAT.cap);

  // moonlight beyond the gate
  const beyondMat = new THREE.MeshBasicMaterial({ map: radial('#e8edff', '#2b3570') });
  const beyond = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 2.6), beyondMat);
  beyond.position.set(1, 0.7, -1.56);
  scene.add(beyond);

  // left wall with a lattice window
  const leftShape = new THREE.Shape();
  leftShape.moveTo(-1.5, 0);
  leftShape.lineTo(6.5, 0);
  leftShape.lineTo(6.5, WALL_H);
  leftShape.lineTo(-1.5, WALL_H);
  leftShape.closePath();
  {
    const hole = new THREE.Path();
    for (let i = 0; i < 8; i++) {
      const a = Math.PI / 8 + i * (Math.PI / 4);
      const px = 2.5 + Math.cos(a) * 0.6, py = 1.25 + Math.sin(a) * 0.6;
      if (i === 0) hole.moveTo(px, py); else hole.lineTo(px, py);
    }
    hole.closePath();
    leftShape.holes.push(hole);
  }
  const leftWall = mesh(new THREE.ExtrudeGeometry(leftShape, { depth: 1, bevelEnabled: false }), MAT.plaster);
  leftWall.rotation.y = -Math.PI / 2;
  leftWall.position.x = -0.5;
  // the left caps start where the back caps end, so the corner has no overlapping faces
  box(-1, WALL_H + 0.07, 3.11, 1.24, 0.14, 6.98, MAT.cap);
  box(-1, WALL_H + 0.19, 2.885, 0.34, 0.1, 7.43, MAT.cap);
  [-1, 1].forEach((s) => {
    [-0.32, 0, 0.32].forEach((o) => {
      const bar = box(-1, 1.25, 2.5 + o, 0.05, 1.5, 0.04, MAT.wood);
      bar.rotation.x = s * Math.PI / 4;
    });
  });

  // pillars and low walls (the occluders)
  PILLARS.forEach((p) => {
    if (p.h > 2) {
      box(p.x, 0.06, p.z, 0.8, 0.12, 0.8, MAT.stone);
      box(p.x, 1.25, p.z, 0.7, 2.5, 0.7, MAT.lacquer);
      box(p.x, 2.57, p.z, 0.9, 0.14, 0.9, MAT.cap);
      box(p.x, 2.76, p.z, 0.58, 0.24, 0.58, MAT.stone);
      const roof = mesh(PYR_UP, MAT.cap);
      roof.scale.set(0.82, 0.4, 0.82);
      roof.position.set(p.x, 2.88 + 0.2, p.z);
    } else {
      box(p.x, 0.53, p.z, 0.7, 1.06, 0.7, MAT.stone);
      box(p.x, 1.13, p.z, 0.7, 0.14, 0.7, MAT.stoneDark);
    }
  });

    g.lineTo(37, 63);

    g.beginPath(); g.moveTo(6, 56); g.quadraticCurveTo(15, 51, 24, 56); g.stroke();
    g.beginPath(); g.moveTo(9, 64); g.quadraticCurveTo(17, 60, 25, 64); g.quadraticCurveTo(17, 67, 9, 64); g.fillStyle = LINE; g.fill();

  const texRight = canvasTexture(240, 360, (g) => drawPuppet(g, false));
  const texLeft = canvasTexture(240, 360, (g) => drawPuppet(g, true));

  // ---------- sound ----------
  const SCALE = [293.66, 329.63, 369.99, 440, 493.88, 587.33, 659.25];
  const Sound = {
    ctx: null,
    on: true,
    cache: new Map(),
    ni: 0,
    ensure() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { return; }
      const c = this.ctx;
      this.master = c.createGain();
      this.master.gain.value = this.on ? 0.9 : 0;
      this.master.connect(c.destination);
      this.dry = c.createGain();
      this.dry.gain.value = 0.8;
      this.dry.connect(this.master);
      const verb = c.createConvolver();
      verb.buffer = this.impulse(3.4);
      this.wet = c.createGain();
      this.wet.gain.value = 0.42;
      this.wet.connect(verb);
      verb.connect(this.master);
      this.ambience();
    },
    impulse(sec) {
      const c = this.ctx, n = Math.floor(c.sampleRate * sec), buf = c.createBuffer(2, n, c.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.8);
      }
      return buf;
    },
    send(node) { node.connect(this.dry); node.connect(this.wet); },
    // Karplus-Strong pluck, close enough to a guqin string at night
    string(freq) {
      const k = Math.round(freq);
      if (this.cache.has(k)) return this.cache.get(k);
      const sr = this.ctx.sampleRate, len = Math.floor(sr * 2.4);
      const buf = this.ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
      const P = Math.max(2, Math.round(sr / freq)), line = new Float32Array(P);
      for (let i = 0; i < P; i++) line[i] = Math.random() * 2 - 1;
      for (let i = 1; i < P; i++) line[i] = 0.5 * (line[i] + line[i - 1]);
      for (let i = 0, j = 0; i < len; i++) {
        const cur = line[j];
        line[j] = 0.4985 * (cur + line[(j + 1) % P]);
        d[i] = cur;
        j = (j + 1) % P;
      }

      s.connect(g);

    bell(freq, delay, vol, decay) {

      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);

        og.gain.value = a;

      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4);

      s.buffer = buf;
      f.type = 'bandpass';
      f.frequency.value = freq;
      f.Q.value = 6;
      g.gain.value = vol;

      f.connect(g);
      this.send(g);

    step() { this.tap(900 + Math.random() * 300, 0.35); },
    arrive() { this.ni = (this.ni + 1) % SCALE.length; this.pluck(SCALE[this.ni], 0, 0.11); },
    creak() { this.tap(2400 + Math.random() * 500, 0.12); },
    rest() { this.bell(1760, 0, 0.025, 1.4); this.bell(2637, 0.06, 0.018, 1.6); },
    blocked() { this.pluck(146.83, 0, 0.16); this.pluck(155.56, 0.02, 0.1); },
    nope() { this.pluck(220, 0, 0.08); },
    win() {

    ambience() {

        o.connect(g);
        o.start(t);
      });

      wind.loop = true;
      lp.type = 'lowpass';
      lp.frequency.value = 380;
      wg.gain.value = 0.18;
      wind.connect(lp);
      lp.connect(wg);
      wg.connect(g);
      wind.start(t);
      this.send(g);

  // ---------- state ----------
  const state = { theta: START_K * STEP, k: START_K, won: false, moved: false, rotated: false, winT: -1, shake: 0, shiver: 0 };
  let shade = new Set();
  let liveShade = new Set();
  const walker = { tile: START, step: null, path: [], pending: null, exit: null };
  let lampAnim = null;
  const mod8 = (k) => ((k % 8) + 8) % 8;

  function tileWorld(id, out) {
    const t = TILES.get(id);
    return out.set(t.x, 0, t.z);
  }
  function setLampTheta(theta) {
    state.theta = theta;
    arm.rotation.y = -theta;
    renderer.shadowMap.needsUpdate = true;
    liveShade = shadeAt(theta);
  }
  // how far the lantern can travel toward `to` before its light would reach her
  function safeReach(from, to) {
    const tile = TILES.get(walker.tile);
    const dir = Math.sign(to - from);
    let a = from;
    while (Math.abs(to - a) > 1e-9) {
      const next = Math.abs(to - a) <= SWEEP ? to : a + dir * SWEEP;
      if (!inShadow(tile, next)) return { angle: a, blocked: true };
      a = next;
    }
    return { angle: a, blocked: false };
  }

    const before = state.k;
    state.k = mod8(Math.round(theta / STEP));
    setLampTheta(theta);

      state.rotated = true;
      hintRing.visible = false;
      Sound.rest();
    }
    updateHint();
  }
  function animateLamp(to, dur) {

  }

    if (state.won || walker.step || lampAnim) return;
    const target = (Math.round(state.theta / STEP) + n) * STEP;
    const r = safeReach(state.theta, target);
    if (r.blocked) { onBlocked(); return; }

  }

    state.shiver = 1;

  }

  // ---------- hints ----------
  let hintTimer = 0, flashTimer = 0, flashing = false;
  function showHint(text, warm) {
    if (hintEl.dataset.text === text && hintEl.classList.contains('warm') === !!warm) return;
    hintEl.dataset.text = text;
    hintEl.classList.remove('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => {
      hintEl.textContent = text;
      hintEl.classList.toggle('warm', !!warm);
      if (text) hintEl.classList.add('show');
    }, 220);
  }
  function flashHint(text, warm) {
    flashing = true;
    showHint(text, warm);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { flashing = false; updateHint(); }, 2400);
  }
  function updateHint() {
    if (flashing) return;
    if (state.won) return showHint('');
    if (!state.rotated && !state.moved) return showHint('她只能走在影子里。拖动灯笼，影子会跟着转');
    if (findPath(walker.tile, GATE_IN, shade)) return showHint('月门就在前面');
    if (state.rotated && !state.moved) return showHint('点发蓝的石板，带她走过去');
    return showHint('一边转灯，一边走向月门');
  }

  // ---------- walking ----------
  const fx = [];
  const RING = new THREE.RingGeometry(0.17, 0.23, 48);
  RING.rotateX(-Math.PI / 2);
  function ripple(id, color) {
    const m = new THREE.Mesh(RING, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95, depthWrite: false }));
    tileWorld(id, m.position);
    m.position.y = 0.02;
    m.renderOrder = 5;
    scene.add(m);
    fx.push({ m, t: 0 });
  }
  function walkTo(id) {
    if (state.won || lampAnim || press && press.dragging) return;
    if (!shade.has(id)) {
      ripple(id, 0xffb066);
      Sound.nope();
      flashHint('那里有光，她过不去', true);
      return;
    }
    ripple(id, 0xc4d2ff);
    if (walker.step) { walker.pending = id; return; }
    if (id === walker.tile) return;
    const path = findPath(walker.tile, id, shade);
    if (!path) {
      Sound.nope();
      flashHint('影子没有连到那里，转一转灯笼', true);
      return;
    }
    walker.path = path.slice(1);
    nextStep();
  }
  function nextStep() {
    if (walker.pending) {
      const p = findPath(walker.tile, walker.pending, shade);
      walker.pending = null;
      walker.path = p ? p.slice(1) : [];
    }
    if (!walker.path.length) { updateHint(); return; }
    const to = walker.path.shift();
    const a = tileWorld(walker.tile, new THREE.Vector3()), b = tileWorld(to, new THREE.Vector3());
    const screenDx = (b.x - a.x) - (b.z - a.z);

    walker.step = { to, a, b, t: 0 };
    state.moved = true;
  }

    const s = walker.step;
    if (s) {

      char.position.lerpVectors(s.a, s.b, s.t);
      puppet.position.y = Math.abs(Math.sin(s.t * Math.PI)) * 0.05;
      puppet.rotation.z = Math.sin(s.t * Math.PI * 2) * 0.07;

        walker.step = null;
        Sound.step();
        if (s.to === GATE) { win(); return; }
        nextStep();
        if (!walker.step) Sound.arrive();

      return;

    if (walker.exit) {
      const e = walker.exit;
      e.t = Math.min(1, e.t + dt / 1.4);
      char.position.set(1, 0, -1 - 0.9 * e.t);
      puppetMat.opacity = 1 - e.t;
      return;

    puppet.position.y = 0;
    puppet.rotation.z = sh > 0 ? Math.sin(clock.t * 60) * 0.08 * sh : Math.sin(clock.t * 1.6) * 0.015;

  // ---------- win / reset ----------
  const card = document.getElementById('card');
  function win() {

    puppetMat.transparent = true;
    puppetMat.alphaTest = 0.02;
    walker.exit = { t: 0 };

      card.hidden = false;
      requestAnimationFrame(() => card.classList.add('show'));

  }
  function reset(data) {
    state.won = false;
    state.winT = -1;
    state.moved = false;
    state.rotated = false;
    state.shake = state.shiver = 0;
    card.classList.remove('show');
    card.hidden = true;
    lampAnim = null;
    walker.step = null;
    walker.path = [];
    walker.pending = null;
    walker.exit = null;
    puppetMat.opacity = 1;
    puppetMat.transparent = false;
    puppetMat.alphaTest = 0.45;
    puppetMat.map = texLeft;
    beyondMat.color.setRGB(0.55, 0.55, 0.6);
    lampLight.intensity = 1.9;
    hintRing.visible = true;
    let k = START_K, tile = START;
    if (data && Number.isInteger(data.k) && TILES.has(data.tile) && data.tile !== GATE) {
      const s = shadeAt(data.k * STEP);
      if (s.has(data.tile)) { k = data.k; tile = data.tile; }
    }
    walker.tile = tile;
    state.k = k;
    state.theta = k * STEP;
    setLampTheta(state.theta);
    shade = shadeAt(state.theta);
    state.rotated = state.moved = tile !== START;
    hintRing.visible = !state.rotated;
    tileWorld(tile, char.position);
    flashing = false;
    updateHint();
  }

  // ---------- input ----------
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const lampPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -LAMP_Y);
  const tmp = new THREE.Vector3();
  function aim(cx, cy) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
  }
  function hitAt(cx, cy) {
    aim(cx, cy);
    const hits = raycaster.intersectObjects(pickables, false);
    for (const h of hits) {
      if (h.object.userData.lamp) return { lamp: true };
      if (h.object.userData.tile) return { tile: h.object.userData.tile };
      return null;
    }
    return null;
  }
  function angleAt(cx, cy) {
    aim(cx, cy);
    if (!raycaster.ray.intersectPlane(lampPlane, tmp)) return null;
    return Math.atan2(tmp.z - POST.z, tmp.x - POST.x);
  }

  let press = null;
  canvas.addEventListener('pointerdown', (e) => {
    Sound.ensure();
    if (state.won || press) return;
    const hit = hitAt(e.clientX, e.clientY);
    press = { id: e.pointerId, x: e.clientX, y: e.clientY, hit, moved: 0, dragging: false };
    if (hit && hit.lamp && !walker.step && !lampAnim) {
      press.last = angleAt(e.clientX, e.clientY);
      press.base = state.theta;
      press.acc = 0;
      press.startTheta = state.theta;
    }
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not needed for mouse */ }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!press) {
      if (e.pointerType === 'mouse') {
        const h = hitAt(e.clientX, e.clientY);
        canvas.style.cursor = !h ? 'default' : h.lamp ? 'grab' : shade.has(h.tile) ? 'pointer' : 'not-allowed';
      }
      return;
    }
    if (e.pointerId !== press.id) return;
    press.moved = Math.max(press.moved, Math.hypot(e.clientX - press.x, e.clientY - press.y));
    if (!press.dragging && press.base !== undefined && press.moved > 5 && press.last !== null) {
      press.dragging = true;
      canvas.style.cursor = 'grabbing';
    }
    if (!press.dragging) return;
    const a = angleAt(e.clientX, e.clientY);
    if (a === null) return;
    let d = a - press.last;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    press.acc += d;
    press.last = a;
    const r = safeReach(state.theta, press.base + press.acc);
    if (r.angle !== state.theta) {
      if (Math.floor(r.angle / (STEP / 6)) !== Math.floor(state.theta / (STEP / 6))) Sound.creak();
      setLampTheta(r.angle);
    }
    if (r.blocked && !press.warned) { press.warned = true; onBlocked(); }
    if (!r.blocked) press.warned = false;
  });
  function endPress(e) {
    if (!press || e.pointerId !== press.id) return;
    const p = press;
    press = null;
    canvas.style.cursor = 'default';
    if (p.dragging) {
      const near = Math.round(state.theta / STEP) * STEP;
      const other = state.theta > near ? near + STEP : near - STEP;
      const target = [near, other, Math.round(p.startTheta / STEP) * STEP].find((c) => !safeReach(state.theta, c).blocked);
      animateLamp(target === undefined ? p.startTheta : target);
      return;
    }
    if (e.type === 'pointercancel' || p.moved > 12 || !p.hit) return;
    if (p.hit.lamp) rotateBy(1);
    else if (p.hit.tile) walkTo(p.hit.tile);
  }
  canvas.addEventListener('pointerup', endPress);
  canvas.addEventListener('pointercancel', endPress);

  window.addEventListener('keydown', (e) => {
    if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey) {
      Sound.ensure();
      rotateBy(e.shiftKey ? -1 : 1);
    }
  });
  const soundBtn = document.getElementById('btn-sound');
  soundBtn.addEventListener('click', () => {
    const on = soundBtn.getAttribute('aria-pressed') !== 'true';
    soundBtn.setAttribute('aria-pressed', String(on));
    soundBtn.setAttribute('aria-label', on ? '声音' : '已静音');
    Sound.toggle(on);
    Sound.ensure();
  });
  document.getElementById('btn-reset').addEventListener('click', () => { Sound.ensure(); reset(); });
  document.getElementById('btn-again').addEventListener('click', () => { Sound.ensure(); reset(); });

  // ---------- framing ----------
  const P = (x, y, z) => new THREE.Vector3(x, y, z);
  const FIT_CORE = [P(-1.5, 2.6, -1.5), P(6.5, 0, -0.5), P(-0.5, 0, 6.5), P(6.5, -0.9, 6.5), P(3, 3.2, 0)];
  const FIT_WIDE = [P(6.5, 2.6, -1.5), P(-1.5, 2.6, 6.5)];
  function fit() {
    const W = window.innerWidth, H = window.innerHeight;
    renderer.setSize(W, H);
    const pts = W > H ? FIT_CORE.concat(FIT_WIDE) : FIT_CORE;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    pts.forEach((p) => {
      const x = p.dot(SCREEN_R), y = p.dot(SCREEN_U);
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    });
    const padTop = Math.min(110, H * 0.13), padBottom = Math.min(90, H * 0.11), padSide = W > H ? Math.max(24, W * 0.05) : 10;
    const availW = W - padSide * 2, availH = H - padTop - padBottom;
    const ppu = Math.min(availW / (maxX - minX), availH / (maxY - minY));
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    camera.left = cx - W / 2 / ppu;
    camera.right = cx + W / 2 / ppu;
    camera.top = cy + (padTop + availH / 2) / ppu;
    camera.bottom = camera.top - H / ppu;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', fit);

  // ---------- loop ----------
  const clock = { last: performance.now(), t: 0 };
  function loop(now) {
    const dt = Math.min(0.05, Math.max(0, (now - clock.last) / 1000));
    clock.last = now;
    tickWorld(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  function tickWorld(dt) {
    clock.t += dt;
    if (lampAnim) {
      const a = lampAnim;
      a.t = Math.min(1, a.t + dt / a.dur);
      const k = 1 - Math.pow(1 - a.t, 3);
      setLampTheta(a.from + (a.to - a.from) * k);
      if (a.t >= 1) { lampAnim = null; settleLamp(a.to); }
    }
    updateWalker(dt);

    // markers follow the live shadow, so they move while the lantern swings
    TILES.forEach((t) => {
      const target = liveShade.has(t.id) ? 1 : 0;
      t.lit += (target - t.lit) * Math.min(1, dt * 10);
      t.marker.material.opacity = t.lit * (0.42 + 0.08 * Math.sin(clock.t * 2 + t.x + t.z));
    });
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i];
      f.t = Math.min(1, f.t + dt / 0.7);
      f.m.scale.setScalar(1 + 0.8 * (1 - Math.pow(1 - f.t, 3)));
      f.m.material.opacity = 0.95 * (1 - f.t);
      if (f.t >= 1) { scene.remove(f.m); f.m.material.dispose(); fx.splice(i, 1); }
    }

    state.shake = Math.max(0, state.shake - dt * 2.5);
    state.shiver = Math.max(0, state.shiver - dt * 1.8);
    shell.rotation.z = Math.sin(clock.t * 40) * 0.25 * state.shake + Math.sin(clock.t * 1.3) * 0.03;
    glow.material.opacity = 0.85 + Math.sin(clock.t * 3.1) * 0.06 + Math.sin(clock.t * 7.3) * 0.04;
    lampLight.intensity = (state.won ? 1.4 : 1.9) + Math.sin(clock.t * 5.3) * 0.04;
    if (hintRing.visible) {
      const p = (clock.t % 1.8) / 1.8;
      hintRing.scale.setScalar(0.8 + p * 0.7);
      hintRing.material.opacity = 0.8 * (1 - p);
    }
    for (let i = 0; i < MOTES; i++) {
      const s = moteSeed[i];
      motePos[i * 3] = s[0] + Math.sin(clock.t * 0.3 + s[3]) * 0.4;
      motePos[i * 3 + 1] = s[1] + Math.sin(clock.t * 0.5 + s[3] * 2) * 0.25;
      motePos[i * 3 + 2] = s[2] + Math.cos(clock.t * 0.27 + s[3]) * 0.4;
    }
    moteGeo.attributes.position.needsUpdate = true;
    if (state.winT >= 0) {
      state.winT = Math.min(1, state.winT + dt / 1.8);
      const k = state.winT * state.winT * (3 - 2 * state.winT);
      beyondMat.color.setRGB(0.55 + 0.45 * k, 0.55 + 0.45 * k, 0.6 + 0.4 * k);
    }
  }

  // ---------- boot ----------
  function start(data) {
    reset(data);
    fit();
    requestAnimationFrame((t) => { clock.last = t; loop(t); });
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ k: state.k, tile: walker.tile }));
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});

  // ---------- sky ----------
  function drawStars() {
    const c = document.getElementById('stars');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = window.innerWidth * dpr;
    c.height = window.innerHeight * dpr;
    c.style.width = window.innerWidth + 'px';
    c.style.height = window.innerHeight + 'px';
    const g = c.getContext('2d');
    let seed = 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const count = Math.round((window.innerWidth * window.innerHeight) / 5200);
    for (let i = 0; i < count; i++) {
      const x = rnd() * c.width, y = Math.pow(rnd(), 1.6) * c.height * 0.8;
      g.fillStyle = 'rgba(239, 230, 210, ' + (0.15 + rnd() * 0.55).toFixed(2) + ')';
      g.beginPath();
      g.arc(x, y, (0.4 + rnd() * 0.9) * dpr, 0, Math.PI * 2);
      g.fill();
    }
  }
})();
</script>
</body>
</html>
