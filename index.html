<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>影径</title>
<meta name="description" content="一个关于光与影的等距小游戏：墨水小精灵只能待在影子里，转动光球，让雕塑的影子替它铺出一条回家的路。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Noto+Sans+SC:wght@200;300;400&display=swap">
<style>
  :root {
    /* Layout: a pale gallery void with the sculpture court as the only object; HUD in the corners, end card as a centred veil */
    --bg-top: #f4f0ea;
    --bg-bottom: #e1d9cf;
    --mist-0: rgba(225, 217, 207, 0);
    --halo: rgba(255, 238, 214, 0.75);
    --ink: #24263a;
    --ink-soft: rgba(36, 38, 58, 0.55);
    --warm: #b8662f;
    --glass: rgba(255, 255, 255, 0.55);
    --glass-strong: rgba(255, 255, 255, 0.9);
    --line: rgba(36, 38, 58, 0.16);
    --veil: rgba(246, 243, 238, 0.88);
    --font-cn: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-latin: "Jost", "Futura", "Century Gothic", sans-serif;
    color-scheme: light;
  }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg-top);
    background-image: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color: var(--ink);
    font-family: var(--font-cn);
    font-weight: 300;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .halo {
    position: fixed; z-index: 0; pointer-events: none;
    left: 50%; top: 46%; width: 120vmin; height: 120vmin;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, var(--halo) 0%, transparent 62%);
  }

  #stage { position: fixed; inset: 0; z-index: 1; }
  #stage canvas { display: block; touch-action: none; outline: none; }

  .mist {
    position: fixed; left: 0; right: 0; bottom: 0; height: 28vh; z-index: 2; pointer-events: none;
    background: linear-gradient(to bottom, var(--mist-0) 0%, var(--bg-bottom) 90%);
  }

  .hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
    padding-left: max(22px, env(safe-area-inset-left, 0px));
    padding-right: max(22px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .title h1 {
    margin: 0;
    font: 200 clamp(28px, 3.4vw, 36px)/1 var(--font-cn);
    letter-spacing: 0.5em;
    color: var(--ink);
  }
  .title p {
    margin: 10px 0 0;
    font: 300 11px/1.4 var(--font-latin);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .actions { display: flex; gap: 10px; }
  .icon-btn {
    width: 42px; height: 42px; padding: 0;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--glass);
    color: var(--ink);
    cursor: pointer;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: background-color 0.2s, transform 0.2s;
  }
  .icon-btn:hover { background: var(--glass-strong); transform: translateY(-1px); }
  .icon-btn:focus-visible, .text-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn .off { display: none; }
  .icon-btn[aria-pressed="false"] .on { display: none; }
  .icon-btn[aria-pressed="false"] .off { display: block; }

  .hint {
    position: fixed; left: 0; right: 0; z-index: 3; margin: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
    font: 300 15px/1.6 var(--font-cn);
    letter-spacing: 0.16em;
    color: var(--ink);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.45s ease, transform 0.45s ease;
    pointer-events: none;
  }
  .hint.show { opacity: 0.9; transform: none; }
  .hint.warm { color: var(--warm); }

  .card {
    position: fixed; inset: 0; z-index: 4;
    display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: radial-gradient(ellipse at 50% 46%, var(--veil) 0%, var(--veil) 30%, transparent 74%);
    opacity: 0;
    transition: opacity 1s ease;
  }
  .card.show { opacity: 1; }
  .card-inner { display: grid; justify-items: center; gap: 16px; text-align: center; max-width: 30ch; }
  .card .eyebrow {
    margin: 0;
    font: 300 11px/1.4 var(--font-latin);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .card h2 {
    margin: 0;
    font: 200 clamp(52px, 10vw, 76px)/1 var(--font-cn);
    letter-spacing: 0.4em;
    padding-left: 0.4em;
    color: var(--ink);
  }
  .card .line { margin: 0; font-size: 15px; line-height: 1.9; letter-spacing: 0.1em; color: var(--ink); }
  .text-btn {
    margin-top: 10px;
    font: 300 14px/1 var(--font-cn);
    letter-spacing: 0.3em;
    padding: 13px 22px 13px 26px;
    border-radius: 999px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s;
  }
  .text-btn:hover { background: var(--ink); color: var(--bg-top); }

  @media (max-width: 480px) {
    .title h1 { letter-spacing: 0.4em; }
    .hint { font-size: 14px; letter-spacing: 0.1em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hint, .card { transition: none; }
  }
</style>
</head>
<body>

<div class="halo" aria-hidden="true"></div>
<div id="stage"></div>
<div class="mist" aria-hidden="true"></div>

<header class="hud">
  <div class="title">
    <h1>影径</h1>
    <p>The Shadow Path · I</p>
  </div>
  <div class="actions">
    <button id="btn-sound" class="icon-btn" type="button" aria-pressed="true" aria-label="声音">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
    <button id="btn-reset" class="icon-btn" type="button" aria-label="重新开始">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg>
    </button>
  </div>
</header>

<p id="hint" class="hint" aria-live="polite"></p>

<section id="card" class="card" hidden aria-live="polite">
  <div class="card-inner">
    <p class="eyebrow">Chapter I · Complete</p>
    <h2>归处</h2>
    <p class="line">小墨跟着影子穿过雕塑园，<br>回到了属于它的暗处。</p>
    <button id="btn-again" class="text-btn" type="button">再走一次</button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  const hintEl = document.getElementById('hint');
  function fail(msg) {
    hintEl.textContent = msg;
    hintEl.classList.add('show');
  }
  if (!window.THREE) return fail('3D 引擎没能加载，请检查网络后刷新页面');

  // ---------- level ----------
  const TAU = Math.PI * 2;
  const STEP = Math.PI / 4;             // the orb rests every 45 degrees
  const SWEEP = Math.PI / 180;          // safety check resolution while it moves
  const N = 7;
  const POST = { x: 3, z: 3 };
  const ARM_R = 1.45;
  const LAMP_Y = 2.1;
  const START = '6,6';
  const START_K = 5;
  const GATE = '1,-1';
  const GATE_IN = '1,0';
  const STEP_TIME = 0.4;

  // Every occluder is an axis-aligned box. The same boxes cast the rendered
  // shadow and decide which tiles it may stand on, so what you see is the rule.
  const PILLARS = [
    { x: 3, z: 0, h: 2.7 },
    { x: 1, z: 5, h: 2.7 },
    { x: 3, z: 4, h: 1.2 },
  ];
  const WALLS = [                       // low slabs running along z
    { x: 2, z0: 1, len: 3, h: 1.0 },
    { x: 4, z0: 2, len: 3, h: 1.0 },
  ];
  const OCCLUDERS = [];
  PILLARS.forEach((p) => OCCLUDERS.push({ lo: [p.x - 0.35, 0, p.z - 0.35], hi: [p.x + 0.35, p.h, p.z + 0.35] }));
  WALLS.forEach((w) => OCCLUDERS.push({ lo: [w.x - 0.18, 0, w.z0 - 0.5], hi: [w.x + 0.18, w.h, w.z0 + w.len - 0.5] }));

  const key = (x, z) => x + ',' + z;
  const BLOCKED = new Set([key(POST.x, POST.z)]);
  PILLARS.forEach((p) => BLOCKED.add(key(p.x, p.z)));
  WALLS.forEach((w) => { for (let i = 0; i < w.len; i++) BLOCKED.add(key(w.x, w.z0 + i)); });
  const TILES = new Map();
  for (let x = 0; x < N; x++) {
    for (let z = 0; z < N; z++) {
      if (!BLOCKED.has(key(x, z))) TILES.set(key(x, z), { id: key(x, z), x, z });
    }
  }
  TILES.set(GATE, { id: GATE, x: 1, z: -1, gate: true });

  function lampAt(theta, out) {
    out[0] = POST.x + ARM_R * Math.cos(theta);
    out[1] = LAMP_Y;
    out[2] = POST.z + ARM_R * Math.sin(theta);
    return out;
  }
  function segHitsBox(p, q, lo, hi) {
    let t0 = 0, t1 = 1;
    for (let a = 0; a < 3; a++) {
      const d = q[a] - p[a];
      if (Math.abs(d) < 1e-9) {
        if (p[a] < lo[a] || p[a] > hi[a]) return false;
        continue;
      }
      let ta = (lo[a] - p[a]) / d, tb = (hi[a] - p[a]) / d;
      if (ta > tb) { const s = ta; ta = tb; tb = s; }
      if (ta > t0) t0 = ta;
      if (tb < t1) t1 = tb;
      if (t0 > t1) return false;
    }
    return true;
  }
  // a tile is shadow when at least 3 of its 5 sample points cannot see the orb
  const SAMPLES = [[0, 0], [0.25, 0.25], [-0.25, 0.25], [0.25, -0.25], [-0.25, -0.25]];
  const _p = [0, 0.05, 0], _q = [0, 0, 0];
  function inShadow(tile, theta) {
    if (tile.gate) return true;
    lampAt(theta, _q);
    let dark = 0;
    for (const s of SAMPLES) {
      _p[0] = tile.x + s[0];
      _p[2] = tile.z + s[1];
      for (const o of OCCLUDERS) {
        if (segHitsBox(_p, _q, o.lo, o.hi)) { dark++; break; }
      }
    }
    return dark >= 3;
  }
  function shadeAt(theta) {
    const out = new Set();
    TILES.forEach((t) => { if (inShadow(t, theta)) out.add(t.id); });
    return out;
  }
  function neighbours(id) {
    const t = TILES.get(id), out = [];
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dz]) => {
      const n = TILES.get(key(t.x + dx, t.z + dz));
      if (n) out.push(n.id);
    });
    return out;
  }
  function findPath(from, to, shade) {
    if (from === to) return [from];
    const prev = new Map([[from, null]]);
    const queue = [from];
    while (queue.length) {
      const cur = queue.shift();
      for (const n of neighbours(cur)) {
        if (!shade.has(n) || prev.has(n)) continue;
        prev.set(n, cur);
        if (n === to) {
          const path = [to];
          for (let p = cur; p; p = prev.get(p)) path.unshift(p);
          return path;
        }
        queue.push(n);
      }
    }
    return null;
  }

  // ---------- renderer ----------
  const stage = document.getElementById('stage');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch (err) {
    return fail('这个浏览器没有开启 WebGL，无法显示雕塑园');
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  const canvas = renderer.domElement;
  canvas.setAttribute('role', 'img');
  canvas.setAttribute('aria-label', '白色雕塑园。墨水小精灵只能待在影子里，拖动或点击光球改变影子，点击有墨点的石板让它走过去。键盘按 R 转动光球。');
  stage.appendChild(canvas);

  const ISO = new THREE.Vector3(1, 1, 1).normalize();
  const SCREEN_R = new THREE.Vector3(1, 0, -1).normalize();
  const SCREEN_U = new THREE.Vector3(-1, 2, -1).normalize();
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-5, 5, 5, -5, 0.1, 500);
  camera.position.copy(ISO).multiplyScalar(150);
  camera.lookAt(0, 0, 0);

  scene.add(new THREE.HemisphereLight(0xdde2f6, 0x8f877c, 0.5));
  const fill = new THREE.DirectionalLight(0xffffff, 0.12);
  fill.position.set(-0.3, 1, 0.6);
  scene.add(fill);

  // ---------- materials ----------
  const INK = 0x24263a;
  const phong = (c, o) => new THREE.MeshPhongMaterial(Object.assign({ color: c, specular: 0x000000, shininess: 4 }, o || {}));
  const MAT = {
    floor: [phong(0xebe6de), phong(0xe5dfd6), phong(0xefeae3)],
    // walls and sculptures carry a little self-light so they stay chalk-white on their unlit
    // faces; the floor has none, which keeps the shadows it receives deep
    plinth: phong(0xe4ded5, { emissive: 0x3b3833 }),
    plinthDeep: phong(0xd9d2c8, { emissive: 0x34312c }),
    plaster: phong(0xf4f1ec, { emissive: 0x4a4744 }),
    plasterWarm: phong(0xece5dc, { emissive: 0x45413c }),
    clay: phong(0xc98e72, { emissive: 0x2e1a12 }),
    black: phong(0x2a2b36),
  };

  // ---------- builders ----------
  const BOX = new THREE.BoxGeometry(1, 1, 1);
  const pickables = [];
  function mesh(geo, mat, parent, opt) {
    opt = opt || {};
    const m = new THREE.Mesh(geo, mat);
    m.castShadow = opt.cast !== false;
    m.receiveShadow = opt.receive !== false;
    (parent || scene).add(m);
    if (opt.pick !== false) pickables.push(m);
    return m;
  }
  function box(x, y, z, sx, sy, sz, mat, parent, opt) {
    const m = mesh(BOX, mat, parent, opt);
    m.position.set(x, y, z);
    m.scale.set(sx, sy, sz);
    return m;
  }
  function canvasTexture(w, h, draw) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    draw(c.getContext('2d'), w, h);
    return new THREE.CanvasTexture(c);
  }
  const radial = (inner, outer) => canvasTexture(128, 128, (g) => {
    const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grd.addColorStop(0, inner);
    grd.addColorStop(1, outer);
    g.fillStyle = grd;
    g.fillRect(0, 0, 128, 128);
  });

  // ---------- the court ----------
  for (let x = 0; x < N; x++) {
    for (let z = 0; z < N; z++) {
      const slab = box(x, -0.12, z, 0.97, 0.24, 0.97, MAT.floor[(x * 7 + z * 3) % 3]);
      if (TILES.has(key(x, z))) slab.userData.tile = key(x, z);
    }
  }
  box(1, -0.12, -1, 0.97, 0.24, 1, MAT.floor[0]).userData.tile = GATE;
  box(2.5, -0.55, 2.5, 8, 0.62, 8, MAT.plinth, scene, { cast: false });
  box(2.5, -1.04, 2.5, 7.3, 0.36, 7.3, MAT.plinthDeep, scene, { cast: false, pick: false });

  // back wall with a dark doorway cut through it
  const WALL_H = 2.3;
  const backShape = new THREE.Shape();
  backShape.moveTo(-1.5, 0);
  backShape.lineTo(0.6, 0);
  backShape.lineTo(0.6, 1.7);
  backShape.lineTo(1.4, 1.7);
  backShape.lineTo(1.4, 0);
  backShape.lineTo(6.5, 0);
  backShape.lineTo(6.5, WALL_H);
  backShape.lineTo(-1.5, WALL_H);
  backShape.closePath();
  const backWall = mesh(new THREE.ExtrudeGeometry(backShape, { depth: 1, bevelEnabled: false }), MAT.plaster);
  backWall.position.z = -1.5;

  // the doorway is filled with ink: the one dark place in a white room, where the spirit belongs
  const beyondMat = new THREE.MeshBasicMaterial({
    map: canvasTexture(16, 128, (g, w, h) => {
      const grd = g.createLinearGradient(0, 0, 0, h);
      grd.addColorStop(0, '#3b3d5c');
      grd.addColorStop(1, '#17182a');
      g.fillStyle = grd;
      g.fillRect(0, 0, w, h);
    }),
  });
  const beyond = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 1.7), beyondMat);
  beyond.position.set(1, 0.85, -0.52);
  scene.add(beyond);

  // left wall with a single horizontal slit
  const leftShape = new THREE.Shape();
  leftShape.moveTo(-1.5, 0);
  leftShape.lineTo(6.5, 0);
  leftShape.lineTo(6.5, WALL_H);
  leftShape.lineTo(-1.5, WALL_H);
  leftShape.closePath();
  {
    const slit = new THREE.Path();
    slit.moveTo(0.6, 1.56);
    slit.lineTo(4.6, 1.56);
    slit.lineTo(4.6, 1.64);
    slit.lineTo(0.6, 1.64);
    slit.closePath();
    leftShape.holes.push(slit);
  }
  const leftWall = mesh(new THREE.ExtrudeGeometry(leftShape, { depth: 1, bevelEnabled: false }), MAT.plaster);
  leftWall.rotation.y = -Math.PI / 2;
  leftWall.position.x = -0.5;

  // sculptures (the occluders). Anything above the orb's height cannot touch the floor shadow,
  // so the tops are free to be ornamental.
  {
    const a = PILLARS[0];
    box(a.x, 1.25, a.z, 0.7, 2.5, 0.7, MAT.plaster);
    mesh(new THREE.SphereGeometry(0.3, 32, 20), MAT.plaster).position.set(a.x, 2.8, a.z);
    const b = PILLARS[1];
    box(b.x, 1.15, b.z, 0.7, 2.3, 0.7, MAT.plasterWarm);
    // a cube balanced on one corner: turn its body diagonal upright
    const cube = box(b.x, 2.3 + 0.42 * Math.sqrt(3) / 2, b.z, 0.42, 0.42, 0.42, MAT.plaster);
    cube.rotation.set(0, Math.PI / 4, Math.atan(Math.SQRT2), 'ZYX');
    const c = PILLARS[2];
    box(c.x, 0.425, c.z, 0.7, 0.85, 0.7, MAT.clay);
    box(c.x, 1.025, c.z, 0.7, 0.35, 0.7, MAT.plaster);
  }
  WALLS.forEach((w, i) => {
    box(w.x, w.h / 2, w.z0 + (w.len - 1) / 2, 0.36, w.h, w.len, i ? MAT.plasterWarm : MAT.plaster);
  });

  // ---------- the orb ----------
  const LAMP_PART = { cast: false, receive: false };
  const post = new THREE.Group();
  post.position.set(POST.x, 0, POST.z);
  scene.add(post);
  const foot = mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.04, 28), MAT.black, post, LAMP_PART);
  foot.position.y = 0.02;
  foot.userData.lamp = true;
  const pole = mesh(new THREE.CylinderGeometry(0.03, 0.03, LAMP_Y + 0.12, 12), MAT.black, post, LAMP_PART);
  pole.position.y = (LAMP_Y + 0.12) / 2;
  pole.userData.lamp = true;

  // a faint orbit with its eight resting points shows where the orb can go
  const guideMat = new THREE.MeshBasicMaterial({ color: INK, transparent: true, opacity: 0.16, depthWrite: false });
  const guide = new THREE.Mesh(new THREE.TorusGeometry(ARM_R, 0.006, 6, 128), guideMat);
  guide.rotation.x = Math.PI / 2;
  guide.position.y = LAMP_Y;
  post.add(guide);
  const stopGeo = new THREE.SphereGeometry(0.022, 10, 8);
  const stopMat = new THREE.MeshBasicMaterial({ color: INK, transparent: true, opacity: 0.35, depthWrite: false });
  for (let k = 0; k < 8; k++) {
    const d = new THREE.Mesh(stopGeo, stopMat);
    d.position.set(ARM_R * Math.cos(k * STEP), LAMP_Y, ARM_R * Math.sin(k * STEP));
    post.add(d);
  }

  const arm = new THREE.Group();
  arm.position.y = LAMP_Y;
  post.add(arm);
  const rod = mesh(new THREE.CylinderGeometry(0.012, 0.012, ARM_R, 8), MAT.black, arm, LAMP_PART);
  rod.rotation.z = Math.PI / 2;
  rod.position.x = ARM_R / 2;
  rod.userData.lamp = true;

  const orbGroup = new THREE.Group();
  orbGroup.position.x = ARM_R;
  arm.add(orbGroup);
  const orb = mesh(new THREE.SphereGeometry(0.16, 32, 20), new THREE.MeshBasicMaterial({ color: 0xfff4e2 }), orbGroup, LAMP_PART);
  orb.userData.lamp = true;
  const grab = mesh(new THREE.SphereGeometry(0.5, 12, 8), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }), orbGroup, LAMP_PART);
  grab.userData.lamp = true;
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: radial('rgba(255,214,160,0.95)', 'rgba(255,190,120,0)'),
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true,
  }));
  glow.scale.setScalar(1.5);
  orbGroup.add(glow);

  const lampLight = new THREE.PointLight(0xffe2b8, 1.45, 11, 1.3);
  lampLight.castShadow = true;
  lampLight.shadow.mapSize.set(1024, 1024);
  lampLight.shadow.bias = -0.003;
  lampLight.shadow.camera.near = 0.05;
  lampLight.shadow.camera.far = 14;
  orbGroup.add(lampLight);

  const hintRing = new THREE.Mesh(
    new THREE.TorusGeometry(0.3, 0.008, 8, 64),
    new THREE.MeshBasicMaterial({ color: INK, transparent: true, opacity: 0.6, depthWrite: false })
  );
  hintRing.rotation.x = Math.PI / 2;
  orbGroup.add(hintRing);

  // ---------- walkable-shadow markers: an ink ring and dot ----------
  const MOTIF = canvasTexture(128, 128, (g) => {
    g.strokeStyle = '#ffffff';
    g.fillStyle = '#ffffff';
    g.lineWidth = 3;
    g.beginPath(); g.arc(64, 64, 30, 0, TAU); g.stroke();
    g.beginPath(); g.arc(64, 64, 7, 0, TAU); g.fill();
  });
  const markerGeo = new THREE.PlaneGeometry(0.8, 0.8);
  markerGeo.rotateX(-Math.PI / 2);
  TILES.forEach((t) => {
    const m = new THREE.Mesh(markerGeo, new THREE.MeshBasicMaterial({
      map: MOTIF, color: INK, transparent: true, opacity: 0, depthWrite: false,
    }));
    m.position.set(t.x, 0.012, t.z);
    m.renderOrder = 2;
    scene.add(m);
    t.marker = m;
    t.lit = 0;
  });

  // ---------- dust in the light ----------
  const MOTES = 16;
  const moteGeo = new THREE.BufferGeometry();
  const motePos = new Float32Array(MOTES * 3);
  const moteSeed = [];
  for (let i = 0; i < MOTES; i++) moteSeed.push([Math.random() * 7 - 0.5, 0.4 + Math.random() * 2, Math.random() * 7 - 0.5, Math.random() * TAU]);
  moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
  const motes = new THREE.Points(moteGeo, new THREE.PointsMaterial({
    size: 2.5, sizeAttenuation: false, color: 0xffffff, transparent: true, opacity: 0.7,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  scene.add(motes);

  // ---------- the ink spirit ----------
  const inkMat = new THREE.MeshBasicMaterial({ color: INK });
  const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const char = new THREE.Group();
  char.scale.setScalar(1.25);
  scene.add(char);
  const blob = new THREE.Group();
  char.add(blob);
  const DR = 0.17, DH = 0.44, dropPts = [];
  for (let i = 0; i <= 10; i++) {
    const a = -Math.PI / 2 + (i / 10) * (Math.PI / 2);
    dropPts.push(new THREE.Vector2(DR * Math.cos(a), DR + DR * Math.sin(a)));
  }
  for (let j = 1; j <= 10; j++) {
    const s = j / 10;
    dropPts.push(new THREE.Vector2(DR * Math.pow(1 - s, 1.3) * (1 + 0.15 * Math.sin(s * Math.PI)), DR + s * (DH - DR)));
  }
  blob.add(new THREE.Mesh(new THREE.LatheGeometry(dropPts, 32), inkMat));
  // the face is a flat card turned toward the camera, like the eyes on a cartoon
  const face = new THREE.Group();
  face.rotation.y = Math.PI / 4;
  face.position.y = 0.17;
  blob.add(face);
  const eyes = new THREE.Group();
  face.add(eyes);
  const EYE = new THREE.CircleGeometry(0.036, 20), PUPIL = new THREE.CircleGeometry(0.019, 16);
  const pupils = [];
  [-0.055, 0.055].forEach((x) => {
    const e = new THREE.Mesh(EYE, whiteMat);
    e.position.set(x, 0, 0.172);
    e.scale.y = 1.25;
    eyes.add(e);
    const p = new THREE.Mesh(PUPIL, inkMat);
    p.position.set(x, -0.004, 0.175);
    eyes.add(p);
    pupils.push({ mesh: p, x });
  });
  const shine = new THREE.Mesh(new THREE.CircleGeometry(0.018, 12), whiteMat);
  shine.position.set(-0.07, 0.06, 0.13);
  face.add(shine);
  let lookX = -1;
  function look(dir) {
    lookX = dir;
    pupils.forEach((p) => { p.mesh.position.x = p.x + dir * 0.012; });
  }

  // ink stains left behind on every step
  const STAIN = new THREE.CircleGeometry(1, 18);
  STAIN.rotateX(-Math.PI / 2);
  const stains = [];
  function stain(x, z) {
    const m = new THREE.Mesh(STAIN, new THREE.MeshBasicMaterial({ color: INK, transparent: true, opacity: 0.45, depthWrite: false }));
    m.scale.setScalar(0.035 + Math.random() * 0.035);
    m.position.set(x + (Math.random() - 0.5) * 0.3, 0.008, z + (Math.random() - 0.5) * 0.3);
    m.renderOrder = 1;
    scene.add(m);
    stains.push({ m, t: 0 });
    if (stains.length > 30) { const old = stains.shift(); scene.remove(old.m); old.m.material.dispose(); }
  }
  function clearStains() {
    stains.forEach((s) => { scene.remove(s.m); s.m.material.dispose(); });
    stains.length = 0;
  }

  // ---------- sound ----------
  const SCALE = [261.63, 329.63, 392.0, 493.88, 587.33, 659.25, 783.99];
  const Sound = {
    ctx: null,
    on: true,
    ni: 0,
    ensure() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { return; }
      const c = this.ctx;
      this.master = c.createGain();
      this.master.gain.value = this.on ? 0.9 : 0;
      this.master.connect(c.destination);
      this.dry = c.createGain();
      this.dry.gain.value = 0.75;
      this.dry.connect(this.master);
      const verb = c.createConvolver();
      verb.buffer = this.impulse(3.6);
      this.wet = c.createGain();
      this.wet.gain.value = 0.5;
      this.wet.connect(verb);
      verb.connect(this.master);
      this.ambience();
    },
    impulse(sec) {
      const c = this.ctx, n = Math.floor(c.sampleRate * sec), buf = c.createBuffer(2, n, c.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
      }
      return buf;
    },
    send(node) { node.connect(this.dry); node.connect(this.wet); },
    // a soft felt-piano note: a few sine partials through a gentle low-pass
    piano(freq, delay, vol, decay) {
      const c = this.ctx;
      if (!c) return;
      decay = decay || 2.2;
      const t = c.currentTime + (delay || 0), g = c.createGain(), lp = c.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 2400;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
      g.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.25);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      [[1, 1], [2, 0.32], [3, 0.1], [4.02, 0.04]].forEach(([m, a]) => {
        const o = c.createOscillator(), og = c.createGain();
        o.frequency.value = freq * m;
        og.gain.value = a;
        o.connect(og);
        og.connect(g);
        o.start(t);
        o.stop(t + decay + 0.1);
      });
      g.connect(lp);
      this.send(lp);
    },
    drip() {
      const c = this.ctx;
      if (!c) return;
      const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
      o.frequency.setValueAtTime(1300 + Math.random() * 300, t);
      o.frequency.exponentialRampToValueAtTime(480, t + 0.07);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      o.connect(g);
      this.send(g);
      o.start(t);
      o.stop(t + 0.12);
    },
    glass() {
      const c = this.ctx;
      if (!c) return;
      const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
      o.frequency.value = 3100 + Math.random() * 400;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.012, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      o.connect(g);
      this.send(g);
      o.start(t);
      o.stop(t + 0.06);
    },
    step() { this.drip(); },
    arrive() { this.ni = (this.ni + 1) % SCALE.length; this.piano(SCALE[this.ni], 0, 0.07); },
    creak() { this.glass(); },
    rest() { this.piano(1046.5, 0, 0.035, 2.6); },
    blocked() { this.piano(130.81, 0, 0.09, 1.2); this.piano(138.59, 0.015, 0.06, 1.2); },
    nope() { this.piano(196, 0, 0.05, 0.8); },
    win() {
      [261.63, 392, 493.88, 587.33, 783.99, 987.77].forEach((f, i) => this.piano(f, i * 0.18, 0.08, 3));
      this.piano(130.81, 1.1, 0.06, 4);
    },
    ambience() {

      const g = c.createGain(), lp = c.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 900;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.022, t + 5);
      [130.81, 196, 329.63, 493.88].forEach((f, i) => {
        [-3, 3].forEach((cents) => {
          const o = c.createOscillator();
          o.frequency.value = f;
          o.detune.value = cents + i;
          o.connect(lp);
          o.start(t);
        });
      });
      const lfo = c.createOscillator(), depth = c.createGain();
      lfo.frequency.value = 0.05;
      depth.gain.value = 300;
      lfo.connect(depth);
      depth.connect(lp.frequency);
      lfo.start(t);
      lp.connect(g);
      this.send(g);
    },
    toggle(on) {
      this.on = on;
      if (this.master) this.master.gain.setTargetAtTime(on ? 0.9 : 0, this.ctx.currentTime, 0.08);
    },
  };

  // ---------- state ----------
  const state = { theta: START_K * STEP, k: START_K, won: false, moved: false, rotated: false, winT: -1, shake: 0, shiver: 0, land: 0, blinkAt: 2 };
  let shade = new Set();
  let liveShade = new Set();
  const walker = { tile: START, step: null, path: [], pending: null, exit: null };
  let lampAnim = null;
  const mod8 = (k) => ((k % 8) + 8) % 8;

  function tileWorld(id, out) {
    const t = TILES.get(id);
    return out.set(t.x, 0, t.z);
  }
  function setLampTheta(theta) {
    state.theta = theta;
    arm.rotation.y = -theta;
    renderer.shadowMap.needsUpdate = true;
    liveShade = shadeAt(theta);
  }
  // how far the orb can travel toward `to` before its light would reach the spirit
  function safeReach(from, to) {
    const tile = TILES.get(walker.tile);
    const dir = Math.sign(to - from);
    let a = from;
    while (Math.abs(to - a) > 1e-9) {
      const next = Math.abs(to - a) <= SWEEP ? to : a + dir * SWEEP;
      if (!inShadow(tile, next)) return { angle: a, blocked: true };
      a = next;
    }
    return { angle: a, blocked: false };
  }
  function settleLamp(theta) {
    const before = state.k;
    state.k = mod8(Math.round(theta / STEP));
    setLampTheta(theta);
    shade = shadeAt(theta);
    if (state.k !== before) {
      state.rotated = true;
      hintRing.visible = false;
      Sound.rest();
    }
    updateHint();
  }
  function animateLamp(to, dur) {
    lampAnim = { from: state.theta, to, t: 0, dur: dur || 0.32 + 0.3 * Math.min(2, Math.abs(to - state.theta) / STEP) };
  }
  function rotateBy(n) {
    if (state.won || walker.step || lampAnim) return;
    const target = (Math.round(state.theta / STEP) + n) * STEP;
    const r = safeReach(state.theta, target);
    if (r.blocked) { onBlocked(); return; }
    animateLamp(target);
  }
  function onBlocked() {
    state.shake = 1;
    state.shiver = 1;
    Sound.blocked();
    flashHint('再转下去，光就会照到它', true);
  }

  // ---------- hints ----------
  let hintTimer = 0, flashTimer = 0, flashing = false;
  function showHint(text, warm) {
    if (hintEl.dataset.text === text && hintEl.classList.contains('warm') === !!warm) return;
    hintEl.dataset.text = text;
    hintEl.classList.remove('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => {
      hintEl.textContent = text;
      hintEl.classList.toggle('warm', !!warm);
      if (text) hintEl.classList.add('show');
    }, 220);
  }
  function flashHint(text, warm) {
    flashing = true;
    showHint(text, warm);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { flashing = false; updateHint(); }, 2400);
  }
  function updateHint() {
    if (flashing) return;
    if (state.won) return showHint('');
    if (!state.rotated && !state.moved) return showHint('小墨只能待在影子里。拖动光球，影子会跟着转');
    if (findPath(walker.tile, GATE_IN, shade)) return showHint('暗门就在前面');
    if (state.rotated && !state.moved) return showHint('点有墨点的石板，带它过去');
    return showHint('一边转动光球，一边走向暗门');
  }

  // ---------- walking ----------
  const fx = [];
  const RING = new THREE.RingGeometry(0.17, 0.21, 48);
  RING.rotateX(-Math.PI / 2);
  function ripple(id, color) {
    const m = new THREE.Mesh(RING, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, depthWrite: false }));
    tileWorld(id, m.position);
    m.position.y = 0.02;
    m.renderOrder = 5;
    scene.add(m);
    fx.push({ m, t: 0 });
  }
  function walkTo(id) {
    if (state.won || lampAnim || press && press.dragging) return;
    if (!shade.has(id)) {
      ripple(id, 0xd9894a);
      Sound.nope();
      flashHint('那里有光，它过不去', true);
      return;
    }
    ripple(id, INK);
    if (walker.step) { walker.pending = id; return; }
    if (id === walker.tile) return;
    const path = findPath(walker.tile, id, shade);
    if (!path) {
      Sound.nope();
      flashHint('影子没有连到那里，转一转光球', true);
      return;
    }
    walker.path = path.slice(1);
    nextStep();
  }
  function nextStep() {
    if (walker.pending) {
      const p = findPath(walker.tile, walker.pending, shade);
      walker.pending = null;
      walker.path = p ? p.slice(1) : [];
    }
    if (!walker.path.length) { updateHint(); return; }
    const to = walker.path.shift();
    const a = tileWorld(walker.tile, new THREE.Vector3()), b = tileWorld(to, new THREE.Vector3());
    const screenDx = (b.x - a.x) - (b.z - a.z);
    if (screenDx !== 0) look(screenDx > 0 ? 1 : -1);
    walker.step = { to, a, b, t: 0 };
    state.moved = true;
  }
  function updateWalker(dt) {
    const s = walker.step;
    state.land = Math.max(0, state.land - dt * 5);
    if (s) {
      s.t = Math.min(1, s.t + dt / STEP_TIME);
      char.position.lerpVectors(s.a, s.b, s.t);
      const hop = Math.sin(s.t * Math.PI);
      blob.position.y = hop * 0.08;
      blob.scale.set(1 - 0.06 * hop, 1 + 0.12 * hop, 1 - 0.06 * hop);
      if (s.t >= 1) {
        walker.tile = s.to;
        walker.step = null;
        state.land = 1;
        Sound.step();
        stain(s.b.x, s.b.z);
        if (s.to === GATE) { win(); return; }
        nextStep();
        if (!walker.step) Sound.arrive();
      }
      return;
    }
    if (walker.exit) {
      const e = walker.exit;
      e.t = Math.min(1, e.t + dt / 1.3);
      char.position.set(1, 0, -1 - 0.7 * e.t);
      blob.scale.setScalar(Math.max(0.001, 1 - e.t));
      return;
    }
    const sh = state.shiver;
    blob.position.y = 0;
    const breathe = Math.sin(clock.t * 2.2) * 0.02;
    const jiggle = sh > 0 ? Math.sin(clock.t * 55) * 0.08 * sh : 0;
    blob.scale.set(1 + 0.08 * state.land + jiggle - breathe / 2, 1 - 0.14 * state.land + breathe, 1 + 0.08 * state.land - jiggle - breathe / 2);
  }

  // ---------- win / reset ----------
  const card = document.getElementById('card');
  function win() {
    state.won = true;
    state.winT = 0;
    showHint('');
    Sound.win();
    walker.exit = { t: 0 };
    setTimeout(() => {
      if (!state.won) return;
      card.hidden = false;
      requestAnimationFrame(() => card.classList.add('show'));
      document.getElementById('btn-again').focus({ preventScroll: true });
    }, 2000);
  }
  function reset(data) {
    state.won = false;
    state.winT = -1;
    state.moved = false;
    state.rotated = false;
    state.shake = state.shiver = state.land = 0;
    card.classList.remove('show');
    card.hidden = true;
    lampAnim = null;
    walker.step = null;
    walker.path = [];
    walker.pending = null;
    walker.exit = null;
    blob.scale.setScalar(1);
    blob.position.y = 0;
    beyondMat.color.setRGB(1, 1, 1);
    clearStains();
    look(-1);
    let k = START_K, tile = START;
    if (data && Number.isInteger(data.k) && TILES.has(data.tile) && data.tile !== GATE) {
      const s = shadeAt(data.k * STEP);
      if (s.has(data.tile)) { k = data.k; tile = data.tile; }
    }
    walker.tile = tile;
    state.k = k;
    state.theta = k * STEP;
    setLampTheta(state.theta);
    shade = shadeAt(state.theta);
    state.rotated = state.moved = tile !== START;
    hintRing.visible = !state.rotated;
    tileWorld(tile, char.position);
    flashing = false;
    updateHint();
  }

  // ---------- input ----------
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const lampPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -LAMP_Y);
  const tmp = new THREE.Vector3();
  function aim(cx, cy) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
  }
  function hitAt(cx, cy) {
    aim(cx, cy);
    const hits = raycaster.intersectObjects(pickables, false);
    for (const h of hits) {
      if (h.object.userData.lamp) return { lamp: true };
      if (h.object.userData.tile) return { tile: h.object.userData.tile };
      return null;
    }
    return null;
  }
  function angleAt(cx, cy) {
    aim(cx, cy);
    if (!raycaster.ray.intersectPlane(lampPlane, tmp)) return null;
    return Math.atan2(tmp.z - POST.z, tmp.x - POST.x);
  }

  let press = null;
  canvas.addEventListener('pointerdown', (e) => {
    Sound.ensure();
    if (state.won || press) return;
    const hit = hitAt(e.clientX, e.clientY);
    press = { id: e.pointerId, x: e.clientX, y: e.clientY, hit, moved: 0, dragging: false };
    if (hit && hit.lamp && !walker.step && !lampAnim) {
      press.last = angleAt(e.clientX, e.clientY);
      press.base = state.theta;
      press.acc = 0;
      press.startTheta = state.theta;
    }
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not needed for mouse */ }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!press) {
      if (e.pointerType === 'mouse') {
        const h = hitAt(e.clientX, e.clientY);
        canvas.style.cursor = !h ? 'default' : h.lamp ? 'grab' : shade.has(h.tile) ? 'pointer' : 'not-allowed';
      }
      return;
    }
    if (e.pointerId !== press.id) return;
    press.moved = Math.max(press.moved, Math.hypot(e.clientX - press.x, e.clientY - press.y));
    if (!press.dragging && press.base !== undefined && press.moved > 5 && press.last !== null) {
      press.dragging = true;
      canvas.style.cursor = 'grabbing';
    }
    if (!press.dragging) return;
    const a = angleAt(e.clientX, e.clientY);
    if (a === null) return;
    let d = a - press.last;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    press.acc += d;
    press.last = a;
    const r = safeReach(state.theta, press.base + press.acc);
    if (r.angle !== state.theta) {
      if (Math.floor(r.angle / (STEP / 6)) !== Math.floor(state.theta / (STEP / 6))) Sound.creak();
      setLampTheta(r.angle);
    }
    if (r.blocked && !press.warned) { press.warned = true; onBlocked(); }
    if (!r.blocked) press.warned = false;
  });
  function endPress(e) {
    if (!press || e.pointerId !== press.id) return;
    const p = press;
    press = null;
    canvas.style.cursor = 'default';
    if (p.dragging) {
      const near = Math.round(state.theta / STEP) * STEP;
      const other = state.theta > near ? near + STEP : near - STEP;
      const target = [near, other, Math.round(p.startTheta / STEP) * STEP].find((c) => !safeReach(state.theta, c).blocked);
      animateLamp(target === undefined ? p.startTheta : target);
      return;
    }
    if (e.type === 'pointercancel' || p.moved > 12 || !p.hit) return;
    if (p.hit.lamp) rotateBy(1);
    else if (p.hit.tile) walkTo(p.hit.tile);
  }
  canvas.addEventListener('pointerup', endPress);
  canvas.addEventListener('pointercancel', endPress);

  window.addEventListener('keydown', (e) => {
    if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey) {
      Sound.ensure();
      rotateBy(e.shiftKey ? -1 : 1);
    }
  });
  const soundBtn = document.getElementById('btn-sound');
  soundBtn.addEventListener('click', () => {
    const on = soundBtn.getAttribute('aria-pressed') !== 'true';
    soundBtn.setAttribute('aria-pressed', String(on));
    soundBtn.setAttribute('aria-label', on ? '声音' : '已静音');
    Sound.toggle(on);
    Sound.ensure();
  });
  document.getElementById('btn-reset').addEventListener('click', () => { Sound.ensure(); reset(); });
  document.getElementById('btn-again').addEventListener('click', () => { Sound.ensure(); reset(); });

  // ---------- framing ----------
  const P = (x, y, z) => new THREE.Vector3(x, y, z);
  const FIT_CORE = [P(-1.5, 2.4, -1.5), P(6.5, 0, -0.5), P(-0.5, 0, 6.5), P(6.5, -0.9, 6.5), P(3, 3.1, 0)];
  const FIT_WIDE = [P(6.5, 2.4, -1.5), P(-1.5, 2.4, 6.5)];
  function fit() {
    const W = window.innerWidth, H = window.innerHeight;
    renderer.setSize(W, H);
    const pts = W > H ? FIT_CORE.concat(FIT_WIDE) : FIT_CORE;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    pts.forEach((p) => {
      const x = p.dot(SCREEN_R), y = p.dot(SCREEN_U);
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    });
    const padTop = Math.min(110, H * 0.13), padBottom = Math.min(90, H * 0.11), padSide = W > H ? Math.max(24, W * 0.05) : 10;
    const availW = W - padSide * 2, availH = H - padTop - padBottom;
    const ppu = Math.min(availW / (maxX - minX), availH / (maxY - minY));
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    camera.left = cx - W / 2 / ppu;
    camera.right = cx + W / 2 / ppu;
    camera.top = cy + (padTop + availH / 2) / ppu;
    camera.bottom = camera.top - H / ppu;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', fit);

  // ---------- loop ----------
  const clock = { last: performance.now(), t: 0 };
  function loop(now) {
    const dt = Math.min(0.05, Math.max(0, (now - clock.last) / 1000));
    clock.last = now;
    tickWorld(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  function tickWorld(dt) {
    clock.t += dt;
    if (lampAnim) {
      const a = lampAnim;
      a.t = Math.min(1, a.t + dt / a.dur);
      const k = 1 - Math.pow(1 - a.t, 3);
      setLampTheta(a.from + (a.to - a.from) * k);
      if (a.t >= 1) { lampAnim = null; settleLamp(a.to); }
    }
    updateWalker(dt);

    // markers follow the live shadow, so they move while the orb swings
    TILES.forEach((t) => {
      const target = liveShade.has(t.id) ? 1 : 0;
      t.lit += (target - t.lit) * Math.min(1, dt * 10);
      t.marker.material.opacity = t.lit * (0.34 + 0.06 * Math.sin(clock.t * 2 + t.x + t.z));
    });
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i];
      f.t = Math.min(1, f.t + dt / 0.7);
      f.m.scale.setScalar(1 + 0.8 * (1 - Math.pow(1 - f.t, 3)));
      f.m.material.opacity = 0.9 * (1 - f.t);
      if (f.t >= 1) { scene.remove(f.m); f.m.material.dispose(); fx.splice(i, 1); }
    }
    for (let i = stains.length - 1; i >= 0; i--) {
      const s = stains[i];
      s.t += dt / 6;
      s.m.material.opacity = 0.45 * Math.max(0, 1 - s.t);
      if (s.t >= 1) { scene.remove(s.m); s.m.material.dispose(); stains.splice(i, 1); }
    }

    // blink now and then
    if (clock.t > state.blinkAt) {
      const b = clock.t - state.blinkAt;
      eyes.scale.y = b < 0.12 ? 0.15 : 1;
      if (b >= 0.12) state.blinkAt = clock.t + 2.5 + Math.random() * 3;
    }

    state.shake = Math.max(0, state.shake - dt * 2.5);
    state.shiver = Math.max(0, state.shiver - dt * 1.8);
    orb.position.y = Math.sin(clock.t * 40) * 0.04 * state.shake + Math.sin(clock.t * 1.4) * 0.012;
    glow.material.opacity = 0.8 + Math.sin(clock.t * 2.1) * 0.08;
    lampLight.intensity = state.won ? 1.2 : 1.45;
    if (hintRing.visible) {
      const p = (clock.t % 1.8) / 1.8;
      hintRing.scale.setScalar(0.8 + p * 0.9);
      hintRing.material.opacity = 0.6 * (1 - p);
    }
    for (let i = 0; i < MOTES; i++) {
      const s = moteSeed[i];
      motePos[i * 3] = s[0] + Math.sin(clock.t * 0.25 + s[3]) * 0.4;
      motePos[i * 3 + 1] = s[1] + Math.sin(clock.t * 0.4 + s[3] * 2) * 0.25;
      motePos[i * 3 + 2] = s[2] + Math.cos(clock.t * 0.22 + s[3]) * 0.4;
    }
    moteGeo.attributes.position.needsUpdate = true;
    if (state.winT >= 0) {
      state.winT = Math.min(1, state.winT + dt / 1.8);
      const k = state.winT * state.winT * (3 - 2 * state.winT);
      beyondMat.color.setRGB(1 + 0.5 * k, 1 + 0.5 * k, 1 + 0.8 * k);
    }
  }

  // ---------- boot ----------
  function start(data) {
    reset(data);
    fit();
    requestAnimationFrame((t) => { clock.last = t; loop(t); });
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ k: state.k, tile: walker.tile }));
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
